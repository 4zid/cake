          <h1 class="page-title">${s.business ? `Hola, ${esc(s.business)}` : 'Hola'}</h1>
        </div>
        <div class="row">
          <button class="btn btn-ghost" data-act="new-sale">Registrar venta</button>
          <button class="btn btn-primary" data-act="new-recipe">${I.plus}Armar una torta</button>
        </div>
      </div>

      <section class="hero-grid" aria-label="Resumen del mes">
        <div class="hero-card">
          <p class="eyebrow">Ganancia de ${esc(monthName)}</p>
          <b class="hero-num money-display ${profit < 0 ? 'neg' : ''}">${money(profit)}</b>
          <p class="hint">${sales.length ? `Cobraste ${money(income)} en ${plural(sales.length, 'venta', 'ventas')}.` : 'Registra tus ventas para ver cuánto ganas en el mes.'}</p>
        </div>
        <div class="hero-side">
          <div class="mini-stat"><small>Tortas calculadas</small><b>${state.recipes.length}</b><small>${plural(state.ingredients.length, 'ingrediente', 'ingredientes')} en tu lista</small></div>
          <div class="mini-stat"><small>Margen promedio</small><b>${avgMargin == null ? '—' : pct(avgMargin)}</b><small>de tus precios de venta</small></div>
        </div>
      </section>

      ${notices.length ? `<div class="notices">${notices.join('')}</div>` : ''}

      <section class="stack">
        <div class="page-head"><h2 class="section-title">Tus tortas</h2>${state.recipes.length > 4 ? '<button class="btn-text" data-go="recipes">Ver todas</button>' : ''}</div>
        ${recent.length ? `<div class="rgrid">${recent.map(recipeCard).join('')}</div>` : emptyRecipes()}
      </section>
    </div>`;
  };

  function emptyRecipes() {
    return `<div class="card empty-state"><h3 class="section-title">Todavía no armaste ninguna torta</h3>
      <p>Agrega los ingredientes uno por uno y mira cómo se arma. Al final te decimos a cuánto venderla.</p>
      <button class="btn btn-primary" data-act="new-recipe">${I.plus}Armar mi primera torta</button></div>`;
  }

  function recipeCard(r) {
    const c = calc(r);
    return `<button class="rcard" data-open="${r.id}">
      <span class="rcard-art">${miniCake(r)}</span>
      <span class="rcard-body">
        <span class="rcard-name">${esc(r.name || 'Torta sin nombre')}</span>
        <span class="rcard-meta">${plural(c.portions, 'porción', 'porciones')} · costo ${money(c.cost)}</span>
        <span class="rcard-price money-display">${money(c.price)}</span>
        <span class="rcard-profit ${c.profit < 0 ? 'neg' : ''}">${c.profit < 0 ? 'Pierdes' : 'Ganas'} ${money(Math.abs(c.profit))}${c.price > 0 ? ` · ${pct(c.marginReal)}` : ''}</span>
        <span class="rcard-chips">${chip(c)}${r.sample ? '<span class="tag">Ejemplo</span>' : ''}${c.missing ? '<span class="chip low">Faltan precios</span>' : ''}</span>
      </span>
    </button>`;
  }

  views.recipes = () => `<div class="page">
      <div class="page-head">
        <div><h1 class="page-title">Tortas</h1><p class="page-lead">Cada torta guarda su receta. Si cambia el precio de un ingrediente, el costo se actualiza solo.</p></div>
        <button class="btn btn-primary" data-act="new-recipe">${I.plus}Armar una torta</button>
      </div>
      ${state.recipes.length ? `<input class="input search" type="search" id="recipe-search" data-in="search" placeholder="Buscar torta…" value="${esc(ui.q)}" aria-label="Buscar torta">` : ''}
      <div id="recipe-list">${recipeList()}</div>
    </div>`;

  function recipeList() {
    if (!state.recipes.length) return emptyRecipes();
    const q = norm(ui.q.trim());
    const list = [...state.recipes].filter((r) => !q || norm(r.name).includes(q)).sort((a, b) => b.updatedAt - a.updatedAt);
    if (!list.length) return `<p class="hint">No hay tortas que coincidan con “${esc(ui.q)}”.</p>`;
    return `<div class="rgrid">${list.map(recipeCard).join('')}</div>`;
  }

  /* ---------- Armar torta ---------- */
  views.recipe = () => {
    const r = findRecipe(route.id);
    const s = state.settings;
    const custom = num(r.price) > 0;
    const sym = esc(curSymbol());
    return `<div class="page">
      <div class="ed-top">
        <button class="btn btn-ghost btn-sm" data-go="recipes">${I.back}Tortas</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" data-act="sale-from-recipe" aria-label="Registrar venta">${I.receipt}<span class="btn-label">Registrar venta</span></button>
        <button class="btn btn-ghost btn-sm" data-act="dup-recipe" aria-label="Duplicar torta">${I.copy}<span class="btn-label">Duplicar</span></button>
        <button class="icon-btn danger" data-act="del-recipe" aria-label="Eliminar torta" title="Eliminar torta">${I.trash}</button>
      </div>

      <div class="ed-title">
        <textarea id="r-name" class="title-input" rows="1" data-in="r" data-k="name" placeholder="Ponle nombre a tu torta" aria-label="Nombre de la torta">${esc(r.name)}</textarea>
        <div class="ed-meta">
          <span class="label">Rinde</span>
          <span class="stepper"><button type="button" data-act="step" data-target="r-portions" data-step="-1" aria-label="Menos porciones">−</button><input id="r-portions" type="number" min="1" step="1" inputmode="numeric" data-in="r" data-k="portions" value="${esc(r.portions)}" aria-label="Porciones"><button type="button" data-act="step" data-target="r-portions" data-step="1" aria-label="Más porciones">+</button></span>
          <span class="label">porciones</span>
          ${r.sample ? '<span class="tag">Torta de ejemplo</span>' : ''}
        </div>
      </div>

      <div class="studio">
        <div class="stage-col">
          <section class="stage" aria-label="Tu torta">
            <div class="stage-art" id="cake-art">${cakeSVG(r, { label: r.name })}</div>
            <p class="stage-cap" id="cake-cap">${stageCaption(r)}</p>
            <button class="btn btn-primary btn-lg btn-block" data-act="add-ing">${I.plus}Agregar ingrediente</button>
          </section>

          <section class="price-panel" id="price-panel" aria-label="Precio de venta">
            <div class="pp-head">
              <h2 class="eyebrow">Precio de venta</h2>
              <div class="seg" role="group" aria-label="Cómo fijar el precio">
                <button data-act="price-mode" data-mode="suggested" aria-pressed="${!custom}">Sugerido</button>
                <button data-act="price-mode" data-mode="custom" aria-pressed="${custom}">Mi precio</button>
              </div>
            </div>
            <div id="pp-suggested" ${custom ? 'hidden' : ''} class="stack">
              <b class="price-big money-display" data-out="suggested"></b>
              <div class="margin-row">
                <label class="label" for="r-margin">Quiero ganar <b data-out="marginPct"></b> del precio</label>
                <input id="r-margin" type="range" min="0" max="80" step="1" data-in="margin" value="${esc(num(r.margin))}">
                <p class="hint" data-out="marginHint"></p>
              </div>
            </div>
            <div id="pp-custom" ${custom ? '' : 'hidden'} class="stack">
              <label class="price-input-wrap" style="--cur-w:${sym.length}ch"><span class="sr">Tu precio de venta</span><span class="cur">${sym}</span><input id="r-price" class="price-input" type="number" min="0" step="any" inputmode="decimal" data-in="r" data-k="price" value="${custom ? esc(r.price) : ''}"></label>
              <p class="hint">Con un margen de <span data-out="marginPct"></span> sugerimos <b data-out="suggested"></b>. <button class="btn-text" data-act="use-suggested">Usar ese</button></p>
            </div>
            <div class="profit-box" id="profit-box">
              <div class="profit-line"><span class="label">Ganas por torta</span><span data-out="chip"></span></div>
              <b class="profit-num" data-out="profit"></b>
              <span class="hint" data-out="profitHint"></span>
            </div>
            <dl class="facts">
              <div><dt>Te cuesta hacerla</dt><dd data-out="cost"></dd></div>
              <div><dt>Margen real</dt><dd data-out="marginReal"></dd></div>
              <div><dt>Precio por porción</dt><dd data-out="perPortion"></dd></div>
              <div><dt>Costo por porción</dt><dd data-out="costPortion"></dd></div>
            </dl>
            <p class="hint" data-out="missingHint"></p>
          </section>
        </div>

        <div class="build-col">
          <section class="bsec" aria-labelledby="st-ing">
            <div class="bsec-head"><h2 class="section-title" id="st-ing">Ingredientes</h2><span class="bsec-total" data-out="ingredients"></span></div>
            <div class="items" id="items">${itemsHTML(r)}</div>
            <button class="btn btn-dashed" data-act="add-ing">${I.plus}Agregar ingrediente</button>
          </section>

          <section class="bsec" aria-labelledby="st-ext">
            <div class="bsec-head"><h2 class="section-title" id="st-ext">Extras y presentación</h2><span class="bsec-total" data-out="extras"></span></div>
            <div class="chips" id="extra-chips">${extraChips(r)}</div>
            <div class="stack" id="extras">${extrasHTML(r)}</div>
          </section>

          <section class="bsec" aria-labelledby="st-work">
            <div class="bsec-head"><h2 class="section-title" id="st-work">Tu trabajo y la cocina</h2><span class="bsec-total" data-out="laborOverhead"></span></div>
            <div class="work-grid">
              <label class="field"><span>Horas de trabajo</span>
                <span class="stepper"><button type="button" data-act="step" data-target="r-hours" data-step="-0.5" aria-label="Menos horas">−</button><input id="r-hours" type="number" min="0" step="0.5" inputmode="decimal" data-in="r" data-k="hours" value="${esc(r.hours)}" placeholder="0"><button type="button" data-act="step" data-target="r-hours" data-step="0.5" aria-label="Más horas">+</button></span>
              </label>
              <label class="field"><span>Tu hora vale</span>${moneyInput('s-rate', 'data-in="setting" data-k="hourlyRate"', s.hourlyRate || '')}</label>
              <label class="field"><span>Gas, luz y otros</span>${moneyInput('r-overhead', 'data-in="r" data-k="overhead"', r.overhead)}</label>
            </div>
            <p class="hint" data-out="rateHint"></p>
          </section>

          <section class="bsec" aria-labelledby="st-break">
            <div class="bsec-head"><h2 class="section-title" id="st-break">¿De dónde sale el precio?</h2></div>
            <div class="bar" data-out="bar" aria-hidden="true"></div>
            <ul class="legend" id="legend"></ul>
            <div id="top-ings"></div>
          </section>

          <details class="bsec notes" ${r.notes ? 'open' : ''}>
            <summary>Notas de la receta</summary>
            <textarea id="r-notes" class="input" rows="4" data-in="r" data-k="notes" placeholder="Temperatura del horno, molde, relleno, pedidos especiales…">${esc(r.notes)}</textarea>
          </details>
        </div>
      </div>

      <div class="minibar" aria-label="Resumen rápido">
        <div><small>Precio</small><b class="mb-price" data-out="price"></b></div>
        <div><small>Ganas</small><b data-out="profit"></b></div>
        <button class="btn btn-sm btn-primary" data-act="to-price">Ver precio</button>
      </div>
    </div>`;
  };

  function stageCaption(r) {
    const n = r.items.filter((l) => findIng(l.ingId)).length;
    if (!n) return 'Tu torta está vacía. Agrega el primer ingrediente y mírala crecer.';
    return `${plural(n, 'ingrediente', 'ingredientes')}${r.extras.length ? ` · ${plural(r.extras.length, 'extra', 'extras')}` : ''}`;
  }
  function itemsHTML(r) {
    if (!r.items.length) return `<p class="hint">Todavía no hay ingredientes. Elígelos de tu lista y di cuánto usas.</p>`;
    return r.items.map((l) => {
      const ing = findIng(l.ingId);
      const units = ing ? BY_TYPE[ing.type] : Object.keys(UNITS);
      return `<div class="item" data-line="${l.id}">
        <div class="item-main">
          <span class="item-name">${ing ? esc(ing.name) : 'Ingrediente eliminado'} ${ing && ing.sample ? '<span class="tag">Precio de ejemplo</span>' : ''}</span>
          ${ing ? `<button class="item-src" data-act="edit-ing" data-id="${ing.id}">${num(ing.price) > 0 ? `Compras ${packLabel(ing)} a ${money(ing.price)} · cambiar` : 'Sin precio · agrégalo'}</button>` : '<span class="item-src">Quítalo o reemplázalo</span>'}
        </div>
        <div class="item-qty">
          <input id="li-qty-${l.id}" type="number" min="0" step="any" inputmode="decimal" data-in="line" data-id="${l.id}" value="${esc(l.qty)}" placeholder="0" aria-label="Cantidad">
          <select id="li-unit-${l.id}" data-ch="line-unit" data-id="${l.id}" aria-label="Unidad">${units.map((k) => `<option value="${k}" ${k === l.unit ? 'selected' : ''}>${UNITS[k].label}</option>`).join('')}</select>
        </div>
        <span class="item-cost" data-linecost="${l.id}"></span>
        <button class="icon-btn danger" data-act="rm-line" data-id="${l.id}" aria-label="Quitar ${ing ? esc(ing.name) : 'ingrediente'}">${I.trash}</button>
      </div>`;
    }).join('');
  }
  function extraChips(r) {
    const have = new Set(r.extras.map((x) => norm(x.name)));
    return EXTRA_PRESETS.map((p) => `<button class="chip-btn" data-act="add-extra" data-name="${esc(p)}" aria-pressed="${have.has(norm(p))}">${have.has(norm(p)) ? '✓ ' : '+ '}${esc(p)}</button>`).join('') +
      `<button class="chip-btn" data-act="add-extra" data-name="">+ Otro</button>`;
  }
  function extrasHTML(r) {
    if (!r.extras.length) return `<p class="hint">Caja, base, velas… también cuestan. Tócalos arriba para sumarlos.</p>`;
    return r.extras.map((x) => `<div class="xrow">
        <input id="ex-name-${x.id}" class="input" data-in="extra" data-k="name" data-id="${x.id}" value="${esc(x.name)}" placeholder="Ej: Caja" aria-label="Nombre del extra">
        ${moneyInput(`ex-cost-${x.id}`, `data-in="extra" data-k="cost" data-id="${x.id}" aria-label="Costo de ${esc(x.name || 'extra')}"`, x.cost)}
        <button class="icon-btn danger" data-act="rm-extra" data-id="${x.id}" aria-label="Quitar extra">${I.trash}</button>
      </div>`).join('');
  }

  function refreshCake(r, floatText) {
    const art = $('#cake-art');
    if (!art) return;
    art.innerHTML = cakeSVG(r, { animate: true, label: r.name });
    $('#cake-cap').textContent = stageCaption(r);
    if (floatText) {
      const stage = art.closest('.stage');
      $$('.stage-float', stage).forEach((e) => e.remove());
      const f = document.createElement('div');
      f.className = 'stage-float';
      f.textContent = floatText;
      stage.appendChild(f);
      setTimeout(() => f.remove(), 2300);
    }
  }
  function refreshBuild(r) {
    $('#items').innerHTML = itemsHTML(r);
    $('#extras').innerHTML = extrasHTML(r);
    $('#extra-chips').innerHTML = extraChips(r);
    updateCalc();
  }

  function updateCalc() {
    const r = findRecipe(route.id);
    if (!r) return;
    const c = calc(r);
    const s = state.settings;
    const m = Math.min(num(r.margin), 90);
    const out = {
      ingredients: money(c.ingredients), extras: money(c.extras), laborOverhead: money(c.labor + c.overhead),
      cost: money(c.cost), price: money(c.price), profit: money(c.profit),
      costPortion: money(c.costPortion), suggested: money(c.suggested),
      marginReal: c.price > 0 ? pct(c.marginReal) : '—', perPortion: money(c.perPortion),
      marginPct: `${Math.round(m)}%`,
      marginHint: m > 0 ? `De cada ${money(100)} que cobras, ${money(m)} te quedan de ganancia.` : 'Sin margen solo recuperas lo que gastaste.',
      profitHint: c.cost <= 0 ? 'Agrega ingredientes para calcular.' : c.profit < 0 ? `Te faltan ${money(-c.profit)} para cubrir el costo.` : c.labor > 0 ? `Además de pagarte ${money(c.labor)} por tu tiempo.` : 'Ojo: no estás contando tu tiempo de trabajo.',
      rateHint: num(s.hourlyRate) > 0
        ? `${fmtQty(num(r.hours))} h × ${money(num(s.hourlyRate))} = ${money(c.labor)}. El valor de tu hora se usa en todas tus tortas.`
        : 'Pon cuánto vale tu hora. Si lo dejas en 0, estás regalando tu trabajo.',
      missingHint: c.missing ? `${plural(c.missing, 'ingrediente no tiene', 'ingredientes no tienen')} precio: el costo real es mayor.` : ''
    };
    $$('[data-out]', view).forEach((el) => { const k = el.dataset.out; if (k in out) el.textContent = out[k]; });
    $$('[data-out="profit"]', view).forEach((el) => el.classList.toggle('neg', c.profit < 0));
    const pb = $('#profit-box'); if (pb) pb.classList.toggle('is-loss', c.profit < 0);
    const chipEl = $('[data-out="chip"]', view); if (chipEl) chipEl.innerHTML = chip(c);

    const total = Math.max(c.price, c.cost) || 1;
    const segs = [['seg-ing', 'Ingredientes', c.ingredients], ['seg-ext', 'Extras', c.extras], ['seg-lab', 'Tu trabajo', c.labor], ['seg-ovh', 'Gas, luz y otros', c.overhead], ['seg-pro', 'Tu ganancia', Math.max(c.profit, 0)]];
    const bar = $('[data-out="bar"]', view);
    if (bar) bar.innerHTML = segs.map(([cl, , v]) => `<span class="${cl}" style="width:${(v / total) * 100}%"></span>`).join('');
    const legend = $('#legend');
    if (legend) legend.innerHTML = segs.map(([cl, name, v]) => `<li><i class="${cl}"></i>${name}<b>${money(v)}</b><small>${c.cost > 0 ? pct(v / total) : ''}</small></li>`).join('');
    const top = $('#top-ings');
    if (top) {
      const list = [...c.lines].sort((a, b) => b.cost - a.cost).slice(0, 3).filter((x) => x.cost > 0);
      const max = list.length ? list[0].cost : 1;
      top.innerHTML = list.length ? `<p class="eyebrow" style="margin-bottom:8px">Los ingredientes que más pesan</p><ul class="top-list">${list.map((x) => `<li><span>${esc(x.name)}</span><b>${money(x.cost)}</b><span class="track"><i style="width:${(x.cost / max) * 100}%"></i></span></li>`).join('')}</ul>` : '';
    }
    for (const l of r.items) {
      const el = $(`[data-linecost="${l.id}"]`, view);
      if (!el) continue;
      const li = lineInfo(l);
      el.classList.toggle('warn', li.missing);
      el.textContent = li.missing ? 'Sin precio' : money(li.cost);
    }
  }

  function fitTitle() {
    const t = $('#r-name');
    if (!t) return;
    t.style.height = 'auto';
    t.style.height = t.scrollHeight + 'px';
  }
  function touch(r) { r.updatedAt = Date.now(); r.sample = false; save(); }

  /* ---------- Selector "Agregar ingrediente" ---------- */
  function addIngredientFlow(r, presetIngId) {
    const st = { q: '', sel: null };
    const m = openModal({ title: 'Agregar ingrediente', body: '', foot: ' ' });
    const body = $('.modal-body', m.el);
    const foot = $('.modal-foot', m.el);
    const inCake = new Set(r.items.map((l) => l.ingId));

    const paintList = () => {
      $('#modal-title', m.el).textContent = 'Agregar ingrediente';
      foot.hidden = true;
      body.innerHTML = `<input class="pick-search" id="pick-q" type="search" placeholder="Buscar o escribir uno nuevo…" value="${esc(st.q)}" autocomplete="off" aria-label="Buscar ingrediente"><div class="pick-list" id="pick-list"></div>`;
      paintResults();
      const q = $('#pick-q', m.el);
      q.addEventListener('input', () => { st.q = q.value; paintResults(); });
      q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const first = $('.pick', m.el); if (first) first.click(); } });
      q.focus({ preventScroll: true });
    };
    const paintResults = () => {
      const q = norm(st.q.trim());
      const mine = [...state.ingredients].filter((i) => !q || norm(i.name).includes(q)).sort((a, b) => (inCake.has(a.id) - inCake.has(b.id)) || a.name.localeCompare(b.name, 'es'));
      const mineNames = new Set(state.ingredients.map((i) => norm(i.name)));
      const common = COMMON.filter(([n]) => !mineNames.has(norm(n)) && (!q || norm(n).includes(q)));
      const exact = mineNames.has(q) || COMMON.some(([n]) => norm(n) === q);
      let html = '';
      if (mine.length) {
        html += `<p class="pick-group">Tu lista de ingredientes</p>` + mine.map((i) => `<button class="pick ${inCake.has(i.id) ? 'in-cake' : ''}" data-pick="ing" data-id="${i.id}">
            <b>${esc(i.name)} ${i.sample ? '<span class="tag">Ejemplo</span>' : ''}</b>
            <small>${num(i.price) > 0 ? `Compras ${packLabel(i)} a ${money(i.price)}` : 'Sin precio todavía'}${inCake.has(i.id) ? ' · ya está en la torta' : ''}</small>
            <span class="pick-right">${num(i.price) > 0 ? `${money(unitCost(i) * PER[i.type].f)}<small>por ${PER[i.type].label}</small>` : ''}</span>
          </button>`).join('');
      }
      if (common.length) {
        html += `<p class="pick-group">Comunes en pastelería</p>` + common.slice(0, q ? 20 : 12).map(([n, qty, u]) => `<button class="pick" data-pick="common" data-name="${esc(n)}" data-qty="${qty}" data-unit="${u}">
            <b>${esc(n)}</b><small>Agregar a tu lista con tu precio</small><span class="pick-right">${I.plus}</span>
          </button>`).join('');
      }
      if (q && !exact) html += `<button class="pick pick-new" data-pick="new"><b>+ Crear “${esc(st.q.trim())}”</b><small>Ingrediente nuevo en tu lista</small></button>`;
      if (!html) html = `<p class="hint">Escribe el nombre del ingrediente para crearlo.</p>`;
      $('#pick-list', m.el).innerHTML = html;
    };

    const paintDetail = () => {
      const sel = st.sel;
      const ing = sel.ing;
      const existingLine = ing ? r.items.find((l) => l.ingId === ing.id) : null;
      const type = UNITS[sel.packUnit].type;
      if (sel.qty === undefined) {
        sel.qty = existingLine ? existingLine.qty : '';
        sel.unit = existingLine ? existingLine.unit : BY_TYPE[type][0];
      }
      if (!UNITS[sel.unit] || UNITS[sel.unit].type !== type) sel.unit = BY_TYPE[type][0];
      const showBuy = !ing || sel.editPrice || !(num(ing.price) > 0);
      $('#modal-title', m.el).textContent = ing ? ing.name : 'Ingrediente nuevo';
      body.innerHTML = `
        <button class="btn-text" data-back style="justify-self:start">← Elegir otro</button>
        ${!ing ? `<label class="field"><span>Nombre</span><input id="pk-name" value="${esc(sel.name)}" autocomplete="off"></label>` : ''}
        ${showBuy ? `<fieldset class="fs"><legend>¿Cómo lo compras?</legend>
            <div class="grid-3">
              <label class="field"><span>Paquete de</span><input id="pk-pqty" type="number" min="0" step="any" inputmode="decimal" value="${esc(sel.packQty)}"></label>
              <label class="field"><span>Unidad</span><select id="pk-punit">${Object.keys(UNITS).map((k) => `<option value="${k}" ${k === sel.packUnit ? 'selected' : ''}>${UNITS[k].label}</option>`).join('')}</select></label>
              <label class="field"><span>Pagaste</span>${moneyInput('pk-price', '', num(sel.price) || '')}</label>
            </div>
            <p class="hint" id="pk-per"></p>
          </fieldset>`
        : `<div class="src-box"><span class="eyebrow">Precio de tu lista</span><div class="row"><span>Compras <b>${packLabel(ing)}</b> a <b>${money(ing.price)}</b> · ${perLabel(ing)}</span><button class="btn-text" data-editprice>Cambiar precio</button></div><small class="hint">Actualizado ${ago(ing.updatedAt)}${ing.sample ? ' · es un precio de ejemplo' : ''}</small></div>`}
        <fieldset class="fs"><legend>¿Cuánto usas en esta torta?</legend>
          <div class="use-row">
            <input id="pk-qty" class="input" type="number" min="0" step="any" inputmode="decimal" value="${esc(sel.qty)}" placeholder="0" aria-label="Cantidad que usas">
            <select id="pk-unit" class="input" aria-label="Unidad">${BY_TYPE[type].map((k) => `<option value="${k}" ${k === sel.unit ? 'selected' : ''}>${UNITS[k].label}</option>`).join('')}</select>
          </div>
          <div class="chips">${QUICK[type].map(([q, u]) => `<button type="button" class="chip-btn" data-quick="${q}" data-unit="${u}">${fmtQty(q)} ${UNITS[u].label}</button>`).join('')}</div>
        </fieldset>
        <p class="calc-out" id="pk-out"></p>`;
      foot.hidden = false;
      foot.innerHTML = `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-confirm>${existingLine ? 'Actualizar' : 'Agregar a la torta'}</button>`;
      preview();
      const f = $(!ing && !String(sel.name || '').trim() ? '#pk-name' : showBuy ? '#pk-price' : '#pk-qty', m.el);
      if (f) f.focus({ preventScroll: true });
    };
    const preview = () => {
      const sel = st.sel;
      if (!sel || !$('#pk-out', m.el)) return;
      const ing = sel.ing;
      const showBuy = !ing || sel.editPrice || !(num(ing.price) > 0);
      const tmp = showBuy ? { packQty: num(sel.packQty), packUnit: sel.packUnit, price: num(sel.price), type: UNITS[sel.packUnit].type } : ing;
      const uc = unitCost(tmp);
      const per = $('#pk-per', m.el);
      if (per) per.textContent = uc > 0 ? `Te sale a ${perLabel(tmp)}.` : 'Si no sabes el precio ahora, puedes cargarlo después.';
      const cost = num(sel.qty) * UNITS[sel.unit].f * uc;
      $('#pk-out', m.el).innerHTML = uc > 0 ? `En esta torta suma <b>${money(cost)}</b>` : 'Sin precio no podemos calcular cuánto suma.';
      $$('[data-quick]', m.el).forEach((b) => b.setAttribute('aria-pressed', String(num(b.dataset.quick) === num(sel.qty) && b.dataset.unit === sel.unit)));
    };

    body.addEventListener('input', (e) => {
      const sel = st.sel; if (!sel) return;
      const t = e.target;
      if (t.id === 'pk-name') sel.name = t.value;
      if (t.id === 'pk-pqty') sel.packQty = t.value;
      if (t.id === 'pk-price') sel.price = t.value;
      if (t.id === 'pk-qty') sel.qty = t.value;
      preview();
    });
    body.addEventListener('change', (e) => {
      const sel = st.sel; if (!sel) return;
      const t = e.target;
      if (t.id === 'pk-punit') { sel.packUnit = t.value; paintDetail(); }
      if (t.id === 'pk-unit') { sel.unit = t.value; preview(); }
    });
    body.addEventListener('click', (e) => {
      const t = e.target;
      const pick = t.closest('[data-pick]');
      if (pick) {
        const k = pick.dataset.pick;
        if (k === 'ing') { const ing = findIng(pick.dataset.id); st.sel = { ing, name: ing.name, packQty: ing.packQty, packUnit: ing.packUnit, price: ing.price }; }
        else if (k === 'common') st.sel = { ing: null, name: pick.dataset.name, packQty: num(pick.dataset.qty), packUnit: pick.dataset.unit, price: '' };
        else st.sel = { ing: null, name: st.q.trim(), packQty: 1, packUnit: 'kg', price: '' };
        paintDetail();
        return;
      }
      if (t.closest('[data-back]')) { st.sel = null; paintList(); return; }
      if (t.closest('[data-editprice]')) { st.sel.editPrice = true; paintDetail(); return; }
      const qb = t.closest('[data-quick]');
      if (qb) { st.sel.qty = num(qb.dataset.quick); st.sel.unit = qb.dataset.unit; $('#pk-qty', m.el).value = st.sel.qty; $('#pk-unit', m.el).value = st.sel.unit; preview(); }
    });
    body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && st.sel && e.target.tagName === 'INPUT') { e.preventDefault(); confirmAdd(); } });
    foot.addEventListener('click', (e) => { if (e.target.closest('[data-confirm]')) confirmAdd(); });

    function confirmAdd() {
      const sel = st.sel;
      let ing = sel.ing;
      const name = (ing ? ing.name : String(sel.name || '')).trim();
      if (!name) { toast('Ponle un nombre al ingrediente'); return; }
      if (!(num(sel.packQty) > 0)) { toast('Indica el tamaño del paquete'); return; }
      if (!(num(sel.qty) > 0)) { const q = $('#pk-qty', m.el); if (q) q.focus(); toast('Indica cuánto usas'); return; }
      const type = UNITS[sel.packUnit].type;
      if (!ing) {
        ing = { id: uid(), name, packQty: num(sel.packQty), packUnit: sel.packUnit, price: num(sel.price), type, updatedAt: Date.now(), sample: false };
        state.ingredients.push(ing);
      } else if (sel.editPrice || !(num(ing.price) > 0)) {
        const changed = num(sel.price) !== num(ing.price) || num(sel.packQty) !== num(ing.packQty) || sel.packUnit !== ing.packUnit;
        Object.assign(ing, { packQty: num(sel.packQty), packUnit: sel.packUnit, price: num(sel.price), type });
        if (changed) { ing.updatedAt = Date.now(); ing.sample = false; }
        state.recipes.forEach((rr) => rr.items.forEach((l) => { if (l.ingId === ing.id && UNITS[l.unit].type !== type) l.unit = BY_TYPE[type][0]; }));
      }
      let line = r.items.find((l) => l.ingId === ing.id);
      if (line) { line.qty = num(sel.qty); line.unit = sel.unit; }
      else { line = { id: uid(), ingId: ing.id, qty: num(sel.qty), unit: sel.unit }; r.items.push(line); }
      touch(r);
      m.close();
      const li = lineInfo(line);
      refreshBuild(r);
      refreshCake(r, `+ ${ing.name}${li.cost > 0 ? ` · ${money(li.cost)}` : ''}`);
      if (window.matchMedia('(max-width: 999px)').matches) $('.stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    if (presetIngId && findIng(presetIngId)) {
      const ing = findIng(presetIngId);
      st.sel = { ing, name: ing.name, packQty: ing.packQty, packUnit: ing.packUnit, price: ing.price, editPrice: true };
      paintDetail();
    } else paintList();
  }

  /* ---------- Ingredientes ---------- */
  views.ingredients = () => {
    const samples = state.ingredients.filter((i) => i.sample).length;
    return `<div class="page">
      <div class="page-head">
        <div><h1 class="page-title">Tu lista de ingredientes</h1><p class="page-lead">De acá salen todos los costos. Cada precio lo cargas tú, con lo que pagaste la última vez que compraste.</p></div>
        <button class="btn btn-primary" data-act="new-ing">${I.plus}Nuevo ingrediente</button>
      </div>
      <div class="explain">
        <div><b>Lo que compras</b><span>El paquete tal cual lo compras: 1 kg de harina, 1 docena de huevos.</span></div>
        <div><b>Lo que pagaste</b><span>El precio de ese paquete. Si sube, lo cambias acá y listo.</span></div>
        <div><b>Lo que te sale</b><span>La app lo divide y calcula el costo exacto de lo que usas en cada torta.</span></div>
      </div>
      ${samples ? `<div class="notice">${I.tag}<p><b>${plural(samples, 'precio es', 'precios son')} de ejemplo</b> (marcados en amarillo). Son inventados para mostrarte la app: cámbialos por los tuyos.</p></div>` : ''}
      ${state.ingredients.length ? `<input class="input search" type="search" id="ing-search" data-in="isearch" placeholder="Buscar ingrediente…" value="${esc(ui.iq)}" aria-label="Buscar ingrediente">` : ''}
      <div id="ing-list">${ingList()}</div>
    </div>`;
  };

  const usedIn = (ingId) => state.recipes.filter((r) => r.items.some((l) => l.ingId === ingId));
  function ingList() {
    if (!state.ingredients.length) {
      return `<div class="card empty-state"><h3 class="section-title">Tu lista está vacía</h3>
        <p>Agrega harina, huevos, azúcar… con lo que pagaste. También puedes agregarlos mientras armas una torta.</p>
        <button class="btn btn-primary" data-act="new-ing">${I.plus}Agregar el primero</button></div>`;
    }
    const q = norm(ui.iq.trim());
    const list = [...state.ingredients].filter((i) => !q || norm(i.name).includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'es'));
    if (!list.length) return `<p class="hint">No hay ingredientes que coincidan con “${esc(ui.iq)}”.</p>`;
    return `<div class="ing-table">
      <div class="ing-row ing-head" aria-hidden="true"><span>Ingrediente</span><span>Lo compras en</span><span>Pagaste</span><span>Te sale</span></div>
      ${list.map((i) => {
        const used = usedIn(i.id).length;
        const stale = Date.now() - i.updatedAt > 30 * DAY;
        return `<div class="ing-row ${i.sample ? 'is-sample' : ''}" data-ing="${i.id}">
          <button class="ing-main" data-act="edit-ing" data-id="${i.id}">
            <span class="ing-name">${esc(i.name)} ${i.sample ? '<span class="tag">Precio de ejemplo</span>' : ''}</span>
            <span class="ing-meta" data-ago>${stale && !i.sample ? `<span class="chip low">Precio de ${ago(i.updatedAt)}</span>` : `Actualizado ${ago(i.updatedAt)}`}${used ? ` · en ${plural(used, 'torta', 'tortas')}` : ''}</span>
          </button>
          <span class="ing-pack"><span class="ing-label">Lo compras en </span>${packLabel(i)}</span>
          <label class="ing-price"><span class="sr">Precio pagado por ${esc(i.name)}</span>${moneyInput(`ip-${i.id}`, `data-ch="ing-price" data-id="${i.id}"`, num(i.price) || '')}</label>
          <span class="ing-unitcost" data-unitcost>${num(i.price) > 0 ? perLabel(i) : '—'}<small>${num(i.price) > 0 ? `por ${PER[i.type].label}` : 'falta el precio'}</small></span>
        </div>`;
      }).join('')}
    </div>`;
  }

  function ingredientModal(ing) {
    const isNew = !ing;
    const d = ing ? { ...ing } : { name: '', packQty: 1, packUnit: 'kg', price: '' };
    const used = ing ? usedIn(ing.id) : [];
    const unitOpts = Object.keys(UNITS).map((k) => `<option value="${k}" ${k === d.packUnit ? 'selected' : ''}>${UNITS[k].label}</option>`).join('');
    const m = openModal({
      title: isNew ? 'Nuevo ingrediente' : 'Editar ingrediente',
      body: `<form id="ing-form" class="stack" novalidate>
          <label class="field"><span>Nombre</span><input id="ing-name" value="${esc(d.name)}" placeholder="Ej: Harina 0000" autocomplete="off" required></label>
          <div class="grid-3">
            <label class="field"><span>Paquete de</span><input id="ing-qty" type="number" min="0" step="any" inputmode="decimal" value="${esc(d.packQty)}"></label>
            <label class="field"><span>Unidad</span><select id="ing-unit">${unitOpts}</select></label>
            <label class="field"><span>Pagaste</span>${moneyInput('ing-price', '', num(d.price) || '')}</label>
          </div>
          <p class="calc-out" id="ing-preview"></p>
          ${used.length ? `<p class="hint">Se usa en ${used.map((r) => `“${esc(r.name || 'Torta sin nombre')}”`).join(', ')}. Al guardar, esas tortas se recalculan.</p>` : ''}
          <button type="submit" hidden></button>
        </form>`,
      foot: `${isNew ? '' : `<button class="btn btn-ghost left" data-del>${I.trash}Eliminar</button>`}<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-save>Guardar</button>`
    });
    const f = $('#ing-form', m.el);
    const preview = () => {
      const tmp = { packQty: num($('#ing-qty', m.el).value), packUnit: $('#ing-unit', m.el).value, price: num($('#ing-price', m.el).value) };
      tmp.type = UNITS[tmp.packUnit].type;
      $('#ing-preview', m.el).textContent = unitCost(tmp) > 0 ? `Te sale a ${perLabel(tmp)}` : 'Completa el paquete y el precio para ver cuánto te sale.';
    };
    f.addEventListener('input', preview);
    f.addEventListener('change', preview);
    preview();
    const submit = (e) => {
      e && e.preventDefault();
      const name = $('#ing-name', m.el).value.trim();
      if (!name) { $('#ing-name', m.el).focus(); toast('Ponle un nombre al ingrediente'); return; }
      const packUnit = $('#ing-unit', m.el).value;
      const packQty = num($('#ing-qty', m.el).value);
      if (!(packQty > 0)) { $('#ing-qty', m.el).focus(); toast('Indica el tamaño del paquete'); return; }
      const price = num($('#ing-price', m.el).value);
      const type = UNITS[packUnit].type;
      if (isNew) {
        state.ingredients.push({ id: uid(), name, packQty, packUnit, price, type, updatedAt: Date.now(), sample: false });
      } else {
        const changed = price !== num(ing.price) || packQty !== num(ing.packQty) || packUnit !== ing.packUnit;
        Object.assign(ing, { name, packQty, packUnit, price, type });
        if (changed) { ing.updatedAt = Date.now(); ing.sample = false; }
        state.recipes.forEach((r) => r.items.forEach((l) => { if (l.ingId === ing.id && UNITS[l.unit].type !== type) l.unit = BY_TYPE[type][0]; }));
      }
      save();
      m.close();
      toast(isNew ? 'Ingrediente agregado' : used.length ? `Guardado. ${plural(used.length, 'torta recalculada', 'tortas recalculadas')}` : 'Ingrediente guardado');
      render();
    };
    f.addEventListener('submit', submit);
    $('[data-save]', m.el).addEventListener('click', submit);
    const del = $('[data-del]', m.el);
    if (del) del.addEventListener('click', async () => {
      m.close();
      const ok = await confirmBox({
        title: `¿Eliminar “${ing.name}”?`,
        text: used.length ? `Se usa en ${plural(used.length, 'torta', 'tortas')}. Ahí quedará marcado como “ingrediente eliminado” para que lo reemplaces.` : 'No se usa en ninguna torta.',
        ok: 'Eliminar', danger: true
      });
      if (!ok) return;
      state.ingredients = state.ingredients.filter((i) => i.id !== ing.id);
      save(); render(); toast('Ingrediente eliminado');
    });
    setTimeout(() => $(isNew ? '#ing-name' : '#ing-price', m.el).focus(), 50);
  }

  /* ---------- Ventas ---------- */
  views.sales = () => {
    const mk = ui.month;
    const list = state.sales.filter((s) => s.date.slice(0, 7) === mk).sort((a, b) => b.date.localeCompare(a.date));
    const income = sum(list, (s) => s.price), cost = sum(list, (s) => s.cost), profit = income - cost;
    const [y, mo] = mk.split('-').map(Number);
    const label = fmtDate(new Date(y, mo - 1, 1), { month: 'long', year: 'numeric' });
    return `<div class="page">
      <div class="page-head">
        <div><h1 class="page-title">Ventas</h1><p class="page-lead">Anota cada torta que vendes y mira cuánto ganaste en el mes.</p></div>
        <button class="btn btn-primary" data-act="new-sale">${I.plus}Registrar venta</button>
      </div>
      <div class="month-nav">
        <button class="icon-btn" data-act="month" data-d="-1" aria-label="Mes anterior">${I.back}</button>
        <span class="month-label">${esc(label)}</span>
        <button class="icon-btn" data-act="month" data-d="1" aria-label="Mes siguiente">${I.next}</button>
      </div>
      <section class="stats">
        <div class="mini-stat main"><small>Ganancia</small><b class="${profit < 0 ? 'neg' : ''}">${money(profit)}</b><small>${list.length ? `Margen ${pct(income > 0 ? profit / income : 0)}` : '&nbsp;'}</small></div>
        <div class="mini-stat"><small>Cobrado</small><b>${money(income)}</b></div>
        <div class="mini-stat"><small>Costos</small><b>${money(cost)}</b></div>
        <div class="mini-stat"><small>Ventas</small><b>${list.length}</b></div>
      </section>
      ${list.length ? `<div class="sale-list">${list.map((s) => {
        const d = new Date(s.date + 'T12:00:00');
        const p = s.price - s.cost;
        return `<div class="sale-row">
          <div class="sale-date"><b>${d.getDate()}</b><small>${esc(fmtDate(d, { month: 'short' }).replace('.', ''))}</small></div>
          <div class="sale-info"><b>${esc(s.title)}</b><small>${s.client ? esc(s.client) + ' · ' : ''}Costo ${money(s.cost)}</small></div>
          <div class="sale-nums"><b>${money(s.price)}</b><small class="${p < 0 ? 'neg' : 'pos'}">${p < 0 ? '' : '+'}${money(p)}</small></div>
          <button class="icon-btn danger" data-act="del-sale" data-id="${s.id}" aria-label="Eliminar venta">${I.trash}</button>
        </div>`;
      }).join('')}</div>` : `<div class="card empty-state"><h3 class="section-title">Sin ventas en este mes</h3><p>Cuando entregues una torta, regístrala acá. Tomamos el costo de la receta para calcular tu ganancia.</p><button class="btn btn-primary" data-act="new-sale">${I.plus}Registrar venta</button></div>`}
    </div>`;
  };

  function saleModal(recipeId) {
    const recipes = [...state.recipes].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'es'));
    const m = openModal({
      title: 'Registrar venta',
      body: `<form id="sale-form" class="stack" novalidate>
        <label class="field"><span>¿Qué torta vendiste?</span><select id="sale-recipe"><option value="">Otra (escribir a mano)</option>${recipes.map((r) => `<option value="${r.id}" ${r.id === recipeId ? 'selected' : ''}>${esc(r.name || 'Torta sin nombre')}</option>`).join('')}</select></label>
        <label class="field" id="sale-title-wrap"><span>Descripción</span><input id="sale-title" placeholder="Ej: Torta de cumpleaños" autocomplete="off"></label>
        <div class="grid-2">
          <label class="field"><span>Cobraste</span>${moneyInput('sale-price', '', '')}</label>
          <label class="field"><span>Te costó</span>${moneyInput('sale-cost', '', '')}</label>
        </div>
        <div class="grid-2">
          <label class="field"><span>Fecha</span><input id="sale-date" type="date" value="${todayISO()}"></label>
          <label class="field"><span>Cliente (opcional)</span><input id="sale-client" placeholder="Ej: Laura" autocomplete="off"></label>
        </div>
        <p class="calc-out" id="sale-preview"></p>
        <button type="submit" hidden></button>
      </form>`,
      foot: `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-save>Guardar venta</button>`
    });
    const sel = $('#sale-recipe', m.el);
    const preview = () => {
      const p = num($('#sale-price', m.el).value) - num($('#sale-cost', m.el).value);
      $('#sale-preview', m.el).innerHTML = `Ganancia de esta venta: <b class="${p < 0 ? 'neg' : 'pos'}">${money(p)}</b>`;
    };
    const fill = () => {
      const r = findRecipe(sel.value);
      $('#sale-title-wrap', m.el).hidden = !!r;
      if (r) {
        const c = calc(r);
        $('#sale-price', m.el).value = Math.round(c.price * 100) / 100 || '';
        $('#sale-cost', m.el).value = Math.round(c.cost * 100) / 100 || '';
      }
      preview();
    };
    sel.addEventListener('change', fill);
    $('#sale-form', m.el).addEventListener('input', preview);
    fill();
    const submit = (e) => {
      e && e.preventDefault();
      const r = findRecipe(sel.value);
      const title = r ? (r.name || 'Torta sin nombre') : $('#sale-title', m.el).value.trim();
      if (!title) { $('#sale-title', m.el).focus(); toast('Escribe qué vendiste'); return; }
      const price = num($('#sale-price', m.el).value);
      if (!(price > 0)) { $('#sale-price', m.el).focus(); toast('Indica cuánto cobraste'); return; }
      const date = $('#sale-date', m.el).value || todayISO();
      state.sales.push({ id: uid(), date, recipeId: r ? r.id : '', title, client: $('#sale-client', m.el).value.trim(), price, cost: num($('#sale-cost', m.el).value) });
      save(); m.close();
      ui.month = date.slice(0, 7);
      toast('Venta registrada');
      if (route.view === 'sales' || route.view === 'home') render();
    };
    $('#sale-form', m.el).addEventListener('submit', submit);
    $('[data-save]', m.el).addEventListener('click', submit);
    setTimeout(() => sel.focus(), 50);
  }

  /* ---------- Ajustes y respaldo ---------- */
  views.settings = () => {
    const s = state.settings;
    const snaps = readSnaps();
    return `<div class="page">
      <div><h1 class="page-title">Ajustes</h1><p class="page-lead">Tus datos de cocina y las copias de seguridad.</p></div>
      <div class="settings">
        <section class="card stack">
          <h2 class="section-title">Tu negocio</h2>
          <div class="grid-2">
            <label class="field"><span>Nombre de tu pastelería</span><input id="set-business" data-in="setting" data-k="business" value="${esc(s.business)}" placeholder="Ej: Dulces de Ana" autocomplete="organization"></label>
            <label class="field"><span>Moneda</span><select id="set-currency" data-ch="currency">${CURRENCIES.map((c) => `<option value="${c[0]}" ${c[0] === s.currency ? 'selected' : ''}>${c[1]} (${c[0]})</option>`).join('')}</select></label>
          </div>
        </section>
        <section class="card stack">
          <h2 class="section-title">Valores por defecto</h2>
          <p class="hint">Se usan al crear una torta nueva. El valor de tu hora se aplica a todas.</p>
          <div class="grid-2">
            <label class="field"><span>Tu hora vale</span>${moneyInput('set-rate', 'data-in="setting" data-k="hourlyRate"', s.hourlyRate || '')}</label>
            <label class="field"><span>Margen de ganancia (%)</span><input id="set-margin" type="number" min="0" max="90" step="1" inputmode="numeric" data-in="setting" data-k="margin" value="${esc(s.margin)}"></label>
            <label class="field"><span>Gas, luz y otros por torta</span>${moneyInput('set-overhead', 'data-in="setting" data-k="overhead"', s.overhead || '')}</label>
          </div>
        </section>

        <section class="card stack" aria-labelledby="bk-title">
          <h2 class="section-title" id="bk-title">Respaldo de tus datos</h2>
          <p class="hint">Todo se guarda en este navegador. Descarga un respaldo de vez en cuando para no perder nada si cambias de teléfono o borras el historial. ${s.lastExport ? `Último respaldo: ${ago(s.lastExport)}.` : 'Todavía no hiciste ninguno.'}</p>
          <div class="row">
            <button class="btn btn-primary" data-act="export">${I.down}Descargar respaldo</button>
            <button class="btn btn-ghost" data-act="copy-backup">${I.copy}Copiar como texto</button>
          </div>
          <div class="row">
            <label class="btn btn-ghost" for="import-file">${I.up}Restaurar desde archivo</label>
            <input id="import-file" type="file" accept=".json,application/json,text/plain" class="sr" data-ch="import-file">
            <button class="btn btn-ghost" data-act="paste-backup">Pegar respaldo</button>
          </div>
          <p class="hint">Si la descarga no empieza, usa “Copiar como texto” y pégalo en una nota o en un mail para ti.</p>
        </section>

        <section class="card stack">
          <h2 class="section-title">Copias automáticas</h2>
          <p class="hint">La app guarda sola una copia cada día que la abres (las últimas ${MAX_SNAPS}) y antes de restaurar o borrar. Sirven si te equivocas, pero viven en este mismo navegador.</p>
          ${snaps.length ? `<ul class="snap-list">${snaps.map((sn) => `<li><span><b>${esc(fmtDate(sn.at, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</b><small>${sn.reason === 'daily' ? 'Al abrir la app' : sn.reason === 'import' ? 'Antes de restaurar' : 'Antes de borrar'} · ${plural((sn.data.recipes || []).length, 'torta', 'tortas')}, ${plural((sn.data.ingredients || []).length, 'ingrediente', 'ingredientes')}</small></span><button class="btn btn-sm btn-ghost" data-act="restore-snap" data-id="${sn.id}">Volver a esta copia</button></li>`).join('')}</ul>` : '<p class="hint">Aún no hay copias automáticas. Aparecen desde el segundo día de uso.</p>'}
        </section>

        <section class="card stack">
          <h2 class="section-title">Otras opciones</h2>
          <div class="row">
            <button class="btn btn-ghost" data-act="replay-onb">Ver la introducción otra vez</button>
            <button class="btn btn-ghost" data-act="load-sample">Agregar torta de ejemplo</button>
            <button class="btn btn-ghost" data-act="reset" style="color:var(--cherry)">${I.trash}Borrar todos los datos</button>
          </div>
        </section>
      </div>
    </div>`;
  };

  const backupPayload = () => ({ app: 'dulce-cuenta', version: 1, exportedAt: new Date().toISOString(), data: state });
  function exportFile() {
    persist();
    try {
      const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dulce-cuenta-respaldo-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      state.settings.lastExport = Date.now();
      save(); render();
      toast('Respaldo descargado');
    } catch (e) {
      copyBackup();
    }
  }
  function copyBackup() {
    const text = JSON.stringify(backupPayload());
    const done = () => { state.settings.lastExport = Date.now(); save(); render(); toast('Respaldo copiado. Pégalo en una nota o mail.'); };
    const fallback = () => {
      const m = openModal({
        title: 'Copia este texto',
        body: `<p class="hint">Selecciona todo el texto y cópialo. Guárdalo en una nota o mándatelo por mail.</p><textarea id="bk-text" class="input" rows="8" readonly>${esc(text)}</textarea>`,
        foot: `<button class="btn btn-primary" data-close>Listo</button>`
      });
      const ta = $('#bk-text', m.el); ta.focus(); ta.select();
      state.settings.lastExport = Date.now(); save();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function parseBackup(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return null; }
    const data = obj && obj.data && typeof obj.data === 'object' ? obj.data : obj;
    if (!data || typeof data !== 'object' || !(Array.isArray(data.recipes) || Array.isArray(data.ingredients))) return null;
    return normalize(data);
  }
  async function restoreData(data, source) {
    const ok = await confirmBox({
      title: '¿Restaurar este respaldo?',
      text: `Tiene ${plural(data.recipes.length, 'torta', 'tortas')}, ${plural(data.ingredients.length, 'ingrediente', 'ingredientes')} y ${plural(data.sales.length, 'venta', 'ventas')}. Reemplaza lo que tienes ahora; antes guardamos una copia automática por si acaso.`,
      ok: 'Restaurar'
    });
    if (!ok) return;
    makeSnapshot('import');
    data.settings.onboarded = true;
    state = data;
    fmtCache.clear();
    persist();
    go('home');
    toast(source === 'snap' ? 'Volviste a la copia elegida' : 'Respaldo restaurado');
  }
  function pasteBackup() {
    const m = openModal({
      title: 'Pegar respaldo',
      body: `<p class="hint">Pega acá el texto que copiaste con “Copiar como texto”.</p><textarea id="paste-text" class="input" rows="8" placeholder='{"app":"dulce-cuenta", …}'></textarea>`,
      foot: `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Continuar</button>`
    });
    $('#paste-text', m.el).focus();
    $('[data-ok]', m.el).addEventListener('click', () => {
      const data = parseBackup($('#paste-text', m.el).value.trim());
      if (!data) { toast('Ese texto no es un respaldo de Dulce Cuenta'); return; }
      m.close();
      restoreData(data, 'paste');
    });
  }

  /* ======================= Datos de ejemplo ======================= */
  /* Usa los ingredientes de la lista si ya existen (con el precio de la usuaria);
     los que falten se crean con precios inventados y marcados como ejemplo. */
  const SAMPLE_PRICES = { 'Harina 0000': 1100, 'Azúcar': 1400, 'Huevos': 3200, 'Manteca': 2600, 'Cacao amargo': 3900, 'Leche': 1500, 'Polvo de hornear': 600, 'Esencia de vainilla': 1800, 'Dulce de leche repostero': 5200, 'Crema de leche': 3300 };
  function addSample() {
    const now = Date.now();
    const get = (name) => {
      const existing = state.ingredients.find((i) => norm(i.name) === norm(name));
      if (existing) {
        if (!(num(existing.price) > 0)) Object.assign(existing, { price: SAMPLE_PRICES[name], sample: true });
        return existing;
      }
      const [, packQty, packUnit] = COMMON.find(([n]) => n === name);
      const i = { id: uid(), name, packQty, packUnit, price: SAMPLE_PRICES[name], type: UNITS[packUnit].type, updatedAt: now, sample: true };
      state.ingredients.push(i);
      return i;
    };
    const line = (name, qty, unit) => ({ id: uid(), ingId: get(name).id, qty, unit });
    const r = {
      id: uid(), name: 'Torta de chocolate y dulce de leche', portions: 12,
      items: [line('Harina 0000', 300, 'g'), line('Azúcar', 250, 'g'), line('Huevos', 4, 'u'), line('Manteca', 150, 'g'), line('Cacao amargo', 60, 'g'), line('Dulce de leche repostero', 500, 'g'), line('Leche', 200, 'ml'), line('Crema de leche', 350, 'ml'), line('Polvo de hornear', 10, 'g'), line('Esencia de vainilla', 5, 'ml')],
      extras: [{ id: uid(), name: 'Caja', cost: 2000 }, { id: uid(), name: 'Decoración', cost: 1800 }, { id: uid(), name: 'Velas', cost: 900 }],
      hours: 3, overhead: state.settings.overhead || 1500, margin: state.settings.margin || 40, price: null,
      notes: 'Ejemplo: horno a 180 °C durante 40 minutos, molde de 24 cm.',
      sample: true, createdAt: now, updatedAt: now
    };
    state.recipes.push(r);
    save();
    return r;
  }

  function newRecipe() {
    const s = state.settings;
    const r = {
      id: uid(), name: '', portions: 12, items: [], extras: [],
      hours: '', overhead: s.overhead || '', margin: s.margin ?? 40, price: null, notes: '', sample: false,
      createdAt: Date.now(), updatedAt: Date.now()
    };
    state.recipes.push(r);
    save();
    go('recipe', { id: r.id });
    setTimeout(() => { const n = $('#r-name'); if (n) n.focus({ preventScroll: true }); }, 30);
  }

  /* ======================= Acciones ======================= */
  const cur = () => findRecipe(route.id);
  const actions = {
    'new-recipe': newRecipe,
    'new-ing': () => ingredientModal(null),
    'edit-ing': (t) => (route.view === 'recipe' ? addIngredientFlow(cur(), t.dataset.id) : ingredientModal(findIng(t.dataset.id))),
    'add-ing': () => addIngredientFlow(cur()),
    'new-sale': () => saleModal(''),
    'sale-from-recipe': () => saleModal(route.id),
    'rm-line': (t) => {
      const r = cur();
      r.items = r.items.filter((l) => l.id !== t.dataset.id); touch(r);
      refreshBuild(r); refreshCake(r);
    },
    'add-extra': (t) => {
      const r = cur();
      const name = t.dataset.name || '';
      const existing = name && r.extras.find((x) => norm(x.name) === norm(name));
      if (existing) { const el = $(`#ex-cost-${existing.id}`); if (el) el.focus(); return; }
      const x = { id: uid(), name, cost: '' };
      r.extras.push(x); touch(r);
      refreshBuild(r);
      refreshCake(r, extraKind(name) ? `+ ${name}` : '');
      const el = $(name ? `#ex-cost-${x.id}` : `#ex-name-${x.id}`); if (el) el.focus({ preventScroll: true });
    },
    'rm-extra': (t) => {
      const r = cur();
      r.extras = r.extras.filter((x) => x.id !== t.dataset.id); touch(r);
      refreshBuild(r); refreshCake(r);
    },
    step: (t) => {
      const input = $('#' + t.dataset.target);
      input.value = Math.max(num(input.min), Math.round((num(input.value) + num(t.dataset.step)) * 100) / 100);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    },
    'price-mode': (t) => {
      const r = cur();
      const custom = t.dataset.mode === 'custom';
      r.price = custom ? (calc(r).price || null) : null;
      touch(r);
      $$('[data-act="price-mode"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === t.dataset.mode)));
      $('#pp-suggested').hidden = custom;
      $('#pp-custom').hidden = !custom;
      const pi = $('#r-price');
      pi.value = r.price || '';
      updateCalc();
      if (custom) { pi.focus(); pi.select(); }
    },
    'use-suggested': () => {
      const r = cur();
      r.price = calc(r).suggested || null; touch(r);
      $('#r-price').value = r.price || '';
      updateCalc();
      toast('Precio sugerido aplicado');
    },
    'to-price': () => { const el = $('#price-panel'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    'dup-recipe': () => {
      const r = cur();
      const copy = JSON.parse(JSON.stringify(r));
      copy.id = uid(); copy.name = (r.name || 'Torta') + ' (copia)'; copy.sample = false;
      copy.items.forEach((l) => (l.id = uid())); copy.extras.forEach((x) => (x.id = uid()));
      copy.createdAt = copy.updatedAt = Date.now();
      state.recipes.push(copy); save();
      go('recipe', { id: copy.id });
      toast('Torta duplicada. Ya puedes cambiarla.');
    },
    'del-recipe': async () => {
      const r = cur();
      const ok = await confirmBox({ title: `¿Eliminar “${r.name || 'Torta sin nombre'}”?`, text: 'Se borra la receta y su cálculo. Las ventas ya registradas no se tocan.', ok: 'Eliminar', danger: true });
      if (!ok) return;
      state.recipes = state.recipes.filter((x) => x.id !== r.id); save();
      go('recipes'); toast('Torta eliminada');
    },
    'del-sale': async (t) => {
      const ok = await confirmBox({ title: '¿Eliminar esta venta?', text: 'Se quita del resumen del mes.', ok: 'Eliminar', danger: true });
      if (!ok) return;
      state.sales = state.sales.filter((s) => s.id !== t.dataset.id); save(); render();
    },
    month: (t) => {
      const [y, m] = ui.month.split('-').map(Number);
      const d = new Date(y, m - 1 + Number(t.dataset.d), 1);
      ui.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      render();
    },
    export: exportFile,
    'copy-backup': copyBackup,
    'paste-backup': pasteBackup,
    'restore-snap': (t) => { const sn = readSnaps().find((s) => s.id === t.dataset.id); if (sn) restoreData(normalize(sn.data), 'snap'); },
    'replay-onb': () => onboarding(),
    'load-sample': () => { const r = addSample(); go('recipe', { id: r.id }); toast('Agregamos una torta de ejemplo'); },
    reset: async () => {
      const ok = await confirmBox({ title: '¿Borrar todos los datos?', text: 'Se eliminan tus tortas, ingredientes y ventas de este navegador. Guardamos una copia automática antes, por si te arrepientes.', ok: 'Borrar todo', danger: true });
      if (!ok) return;
      makeSnapshot('reset');
      state = defaults(); fmtCache.clear(); persist();
      go('home'); onboarding();
    }
  };

  const inputs = {
    r: (t) => {
      const r = cur(); if (!r) return;
      const k = t.dataset.k;
      if (k === 'name' || k === 'notes') r[k] = k === 'name' ? t.value.replace(/\n/g, ' ') : t.value;
      if (k === 'name') fitTitle();
      else if (k === 'price') r.price = numOrNull(t.value);
      else r[k] = t.value === '' ? '' : num(t.value);
      touch(r); updateCalc();
    },
    line: (t) => {
      const r = cur();
      const l = r.items.find((x) => x.id === t.dataset.id); if (!l) return;
      l.qty = t.value === '' ? '' : num(t.value);
      touch(r); updateCalc();
    },
    extra: (t) => {
      const r = cur();
      const x = r.extras.find((e) => e.id === t.dataset.id); if (!x) return;
      x[t.dataset.k] = t.dataset.k === 'cost' ? (t.value === '' ? '' : num(t.value)) : t.value;
      touch(r); updateCalc();
    },
    margin: (t) => {
      const r = cur();
      r.margin = Math.min(Math.max(num(t.value), 0), 90);
      touch(r); updateCalc();
    },
    setting: (t) => {
      const k = t.dataset.k;
      state.settings[k] = k === 'business' ? t.value : num(t.value);
      if (k === 'business') $('#brand-sub').textContent = t.value || 'Costos y ganancias de tus tortas';
      save();
      if (route.view === 'recipe') updateCalc();
    },
    search: (t) => { ui.q = t.value; $('#recipe-list').innerHTML = recipeList(); },
    isearch: (t) => { ui.iq = t.value; $('#ing-list').innerHTML = ingList(); }
  };

  const changes = {
    'line-unit': (t) => {
      const r = cur();
      const l = r.items.find((x) => x.id === t.dataset.id); if (!l) return;
      l.unit = t.value; touch(r); updateCalc();
    },
    'ing-price': (t) => {
      const ing = findIng(t.dataset.id); if (!ing) return;
      ing.price = num(t.value); ing.updatedAt = Date.now(); ing.sample = false;
      save();
      const row = t.closest('.ing-row');
      row.classList.remove('is-sample');
      const tag = $('.ing-name .tag', row); if (tag) tag.remove();
      $('[data-unitcost]', row).innerHTML = num(ing.price) > 0 ? `${perLabel(ing)}<small>por ${PER[ing.type].label}</small>` : '—<small>falta el precio</small>';
      const used = usedIn(ing.id).length;
      $('[data-ago]', row).textContent = `Actualizado hoy${used ? ` · en ${plural(used, 'torta', 'tortas')}` : ''}`;
      toast(used ? `Precio actualizado. ${plural(used, 'torta recalculada', 'tortas recalculadas')}` : 'Precio actualizado');
    },
    currency: (t) => { state.settings.currency = t.value; fmtCache.clear(); save(); render(); toast('Moneda cambiada'); },
    'import-file': (t) => {
      const file = t.files && t.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const data = parseBackup(String(reader.result));
        t.value = '';
        if (!data) { toast('Ese archivo no es un respaldo de Dulce Cuenta'); return; }
        restoreData(data, 'file');
      };
      reader.readAsText(file);
    }
  };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-open],[data-act]');
    if (!t || t.closest('.modal') || t.closest('.onb')) return;
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.dataset.open) { go('recipe', { id: t.dataset.open }); return; }
    const fn = actions[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'r-name') { e.preventDefault(); e.target.blur(); } });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.in && inputs[t.dataset.in] && !t.closest('.modal')) inputs[t.dataset.in](t, e);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.ch && changes[t.dataset.ch] && !t.closest('.modal')) changes[t.dataset.ch](t, e);
  });

  /* ======================= Modal, confirmación y avisos ======================= */
  function openModal({ title, body, foot, onClose }) {
    const prev = document.activeElement;
    const el = document.createElement('div');
    el.className = 'overlay';
    el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="icon-btn" data-close aria-label="Cerrar">${I.close}</button></div>
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
      </div>`;
    document.body.appendChild(el);
    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      el.remove();
      document.removeEventListener('keydown', onKey);
      if (onClose) onClose();
      if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true });
    };
    const onKey = (e) => {
      if (e.key === 'Escape') close();
      if (e.key === 'Tab') {
        const f = $$('button, input, select, textarea, [tabindex]:not([tabindex="-1"])', el).filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    el.addEventListener('mousedown', (e) => { if (e.target === el) close(); });
    el.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
    return { el, close };
  }
  function confirmBox({ title, text, ok = 'Confirmar', danger = false }) {
    return new Promise((resolve) => {
      let answered = false;
      const m = openModal({
        title, body: `<p>${esc(text)}</p>`,
        foot: `<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(ok)}</button>`,
        onClose: () => { if (!answered) resolve(false); }
      });
      const b = $('[data-ok]', m.el);
      b.addEventListener('click', () => { answered = true; m.close(); resolve(true); });
      setTimeout(() => b.focus(), 30);
    });
  }
  let toastTimer;
  function toast(msg) {
    let el = $('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2800);
  }

  /* ======================= Onboarding ======================= */
  function onboarding() {
    const s = state.settings;
    const draft = { business: s.business, currency: s.currency, hourlyRate: s.hourlyRate || '', margin: s.margin || 40, prices: {} };
    const starter = COMMON.slice(0, 10);
    starter.forEach(([n]) => { const i = state.ingredients.find((x) => norm(x.name) === norm(n)); if (i && !i.sample && num(i.price) > 0) draft.prices[n] = i.price; });
    let step = 0;
    const el = document.createElement('div');
    el.className = 'onb';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', 'Bienvenida a Dulce Cuenta');
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    const symFor = () => { try { return new Intl.NumberFormat('es', { style: 'currency', currency: draft.currency }).formatToParts(1).find((x) => x.type === 'currency').value; } catch (e) { return '$'; } };

    const steps = [
      () => `<div class="stack" style="gap:18px">
          <p class="onb-brand">Dulce Cuenta</p>
          <h1 class="onb-title">¿A cuánto vendo <em>esta torta?</em></h1>
          <p class="onb-lead">Arma tu torta ingrediente por ingrediente y te decimos cuánto te cuesta, a cuánto venderla y cuánto te queda.</p>
          <ol class="how">
            <li><div><b>Carga lo que pagas</b><span>Un kilo de harina, una docena de huevos: tus precios reales.</span></div></li>
            <li><div><b>Arma la torta</b><span>Suma ingredientes, extras y tus horas. La ves crecer en pantalla.</span></div></li>
            <li><div><b>Elige tu precio</b><span>Usa el sugerido o pon el tuyo y mira cuánto ganas.</span></div></li>
          </ol>
        </div>
        <div class="onb-actions"><span></span><button class="btn btn-primary btn-lg" data-next>Empezar ${I.next}</button></div>`,
      () => `<form class="stack" id="onb-form" novalidate><h2 class="onb-h">Tu cocina</h2>
          <p class="hint">Puedes cambiarlo después en Ajustes.</p>
          <label class="field"><span>Nombre de tu pastelería (opcional)</span><input id="onb-business" value="${esc(draft.business)}" placeholder="Ej: Dulces de Ana" autocomplete="organization"></label>
          <label class="field"><span>Moneda</span><select id="onb-currency">${CURRENCIES.map((c) => `<option value="${c[0]}" ${c[0] === draft.currency ? 'selected' : ''}>${c[1]} (${c[0]})</option>`).join('')}</select></label>
          <label class="field"><span>¿Cuánto vale una hora de tu trabajo?</span><input id="onb-rate" type="number" min="0" step="any" inputmode="decimal" value="${esc(draft.hourlyRate)}" placeholder="Ej: 3000"><small class="hint">Tu tiempo también es un costo. Piensa cuánto cobrarías por hora en otro trabajo.</small></label>
          <div class="field"><span id="onb-m-label">¿Cuánto quieres ganar sobre el precio?</span>
            <div class="chips" role="group" aria-labelledby="onb-m-label">${[30, 40, 50, 60].map((v) => `<button type="button" class="chip-btn" data-margin="${v}" aria-pressed="${draft.margin === v}">${v}%</button>`).join('')}</div>
            <small class="hint">Entre 30% y 50% es lo habitual en pastelería casera.</small>
          </div></form>
        <div class="onb-actions"><button class="btn btn-ghost" data-prev>${I.back}Atrás</button><button class="btn btn-primary" data-next>Siguiente ${I.next}</button></div>`,
      () => {
        const sym = esc(symFor());
        return `<div class="stack"><h2 class="onb-h">¿Cuánto pagas por esto?</h2>
          <p class="hint">Pon lo que pagaste la última vez. Deja vacío lo que no uses; puedes completar y agregar más después.</p>
          <div class="onb-prices">${starter.map(([n, q, u]) => `<label><span><b>${esc(n)}</b><small>paquete de ${packLabel({ packQty: q, packUnit: u })}</small></span><span class="money" style="--cur-w:${sym.length}ch"><span class="cur">${sym}</span><input type="number" min="0" step="any" inputmode="decimal" data-price="${esc(n)}" value="${esc(draft.prices[n] || '')}" placeholder="0" aria-label="Precio de ${esc(n)}"></span></label>`).join('')}</div>
        </div>
        <div class="onb-actions"><button class="btn btn-ghost" data-prev>${I.back}Atrás</button><button class="btn btn-primary" data-next>Siguiente ${I.next}</button></div>`;
      },
      () => `<div class="stack"><h2 class="onb-h">Todo listo</h2>
          <p class="onb-lead">Tus datos se guardan en este navegador, sin cuentas ni contraseñas. Desde Ajustes puedes descargar un respaldo cuando quieras.</p>
          <div class="choice">
            <button class="primary" data-finish="build"><b>Armar mi primera torta</b><span>Empiezas con una torta vacía y le vas agregando ingredientes.</span></button>
            <button data-finish="sample"><b>Ver una torta de ejemplo</b><span>Una torta de chocolate ya armada. Los precios que no cargaste quedan marcados como “de ejemplo”.</span></button>
          </div></div>
        <div class="onb-actions"><button class="btn btn-ghost" data-prev>${I.back}Atrás</button><span></span></div>`
    ];

    const readForm = () => {
      if ($('#onb-form', el)) {
        draft.business = $('#onb-business', el).value.trim();
        draft.currency = $('#onb-currency', el).value;
        draft.hourlyRate = $('#onb-rate', el).value;
      }
      $$('[data-price]', el).forEach((i) => { draft.prices[i.dataset.price] = i.value; });
    };
    const paint = () => {
      el.innerHTML = `<div class="onb-card">
        <div class="onb-top"><div class="dots" aria-label="Paso ${step + 1} de ${steps.length}">${steps.map((_, i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>
        ${step < steps.length - 1 ? '<button class="btn-text" data-skip>Saltar</button>' : ''}</div>
        ${steps[step]()}
      </div>`;
      const first = $('h1, h2', el);
      if (first) { first.setAttribute('tabindex', '-1'); first.focus({ preventScroll: true }); }
      el.scrollTop = 0;
    };
    const finish = (mode) => {
      readForm();
      Object.assign(state.settings, { business: draft.business, currency: draft.currency, hourlyRate: num(draft.hourlyRate), margin: draft.margin, onboarded: true });
      fmtCache.clear();
      for (const [n, q, u] of starter) {
        const p = num(draft.prices[n]);
        if (!(p > 0)) continue;
        const existing = state.ingredients.find((x) => norm(x.name) === norm(n));
        if (existing) Object.assign(existing, { price: p, sample: false, updatedAt: Date.now() });
        else state.ingredients.push({ id: uid(), name: n, packQty: q, packUnit: u, price: p, type: UNITS[u].type, updatedAt: Date.now(), sample: false });
      }
      el.remove();
      document.body.style.overflow = '';
      if (mode === 'sample') {
        const r = addSample();
        persist();
        go('recipe', { id: r.id });
      } else if (mode === 'build') {
        persist();
        newRecipe();
      } else {
        persist();
        go('home');
      }
    };
    el.addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('[data-next]')) { readForm(); step = Math.min(step + 1, steps.length - 1); paint(); }
      else if (t.closest('[data-prev]')) { readForm(); step = Math.max(step - 1, 0); paint(); }
      else if (t.closest('[data-skip]')) finish('skip');
      else if (t.closest('[data-finish]')) finish(t.closest('[data-finish]').dataset.finish);
      else if (t.closest('[data-margin]')) {
        draft.margin = Number(t.closest('[data-margin]').dataset.margin);
        $$('[data-margin]', el).forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.margin) === draft.margin)));
      }
    });
    el.addEventListener('submit', (e) => { e.preventDefault(); readForm(); step = Math.min(step + 1, steps.length - 1); paint(); });
    paint();
  }

  /* ======================= Inicio ======================= */
  makeSnapshot('daily');
  render();
  if (!state.settings.onboarded) onboarding();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* sin modo offline */ }
  }
})();
</script>
</body>
</html>
