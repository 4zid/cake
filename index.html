<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- artifact:head-start -->
<title>Dulce Cuenta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Calculadora de costos y ganancias para quienes venden tortas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<style>
/* Layout: glaseado rosa arriba con festón; menú lateral en escritorio y barra de botones fija abajo en móvil.
   En "Armar torta" la torta y el precio van a la izquierda (fijos en escritorio) y la receta se arma a la derecha. */
/* Estética clara: blanco con rosa, sin modo oscuro (se ve igual en cualquier dispositivo). */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --frosting: #FFE6EE;
  --surface-2: #FFF4F7;
  --stage: #FFF1F5;
  --ink: #3A2228;
  --ink-soft: #85636B;
  --ink-faint: #B99AA2;
  --line: #F7DDE5;
  --accent: #D63C72;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE5EE;
  --plate: #F8DCE5;
  --box: #FFD6E3;
  --pistachio: #3F8452;
  --pistachio-soft: #E5F4E8;
  --butter: #9A6A0C;
  --butter-soft: #FFF3D6;
  --cherry: #C0292F;
  --cherry-soft: #FFE3E3;
  --cocoa: #A0705C;
  --sponge: #F0CB93;
  --shadow: 0 1px 2px rgba(214, 60, 114, .06), 0 12px 32px rgba(214, 60, 114, .10);
  --backdrop: rgba(58, 34, 40, .32);
  --font-display: "Bagel Fat One", "Cooper Black", "Arial Rounded MT Bold", Georgia, serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --nav-h: 64px;
  --mini-h: 62px;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--frosting);
}
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Topbar con festón ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--frosting); }
.topbar::after {
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; pointer-events: none;
  background: radial-gradient(circle at 10px 0, var(--frosting) 9.5px, transparent 10.5px) 0 0 / 20px 10px repeat-x;
}
.topbar-inner {
  max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: grid; gap: 2px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.brand-name { font-family: var(--font-display); font-size: 1.5rem; color: var(--accent); line-height: 1; }
.brand-sub { font-size: .78rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-state { margin-left: auto; font-size: .8rem; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pistachio); }
.save-state.is-saving .save-dot { background: var(--butter); }
.save-state.is-error .save-dot { background: var(--cherry); }
.save-state.is-error { color: var(--cherry); }

/* ---------- Shell y menú ---------- */
.shell {
  max-width: 1240px; margin: 0 auto; display: grid; gap: 24px;
  padding-top: 28px;
  padding-bottom: calc(var(--nav-h) + 36px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { min-width: 0; }
/* Móvil: barra de botones fija abajo, siempre visible */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -6px 20px rgba(59, 36, 32, .06);
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;
  min-height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-top: 4px;
  padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
  padding-left: max(6px, env(safe-area-inset-left, 0px));
  padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0;
  border: 0; background: none; padding: 4px 2px; border-radius: var(--r-sm);
  color: var(--ink-soft); font-size: .7rem; font-weight: 700; letter-spacing: .01em;
}
.nav-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-btn svg { width: 52px; height: 30px; padding: 4px 15px; border-radius: 999px; transition: background-color .15s ease; }
.nav-btn[aria-current="page"] { color: var(--accent); }
.nav-btn[aria-current="page"] svg { background: var(--accent-soft); }
@media (min-width: 900px) {
  .shell { grid-template-columns: 196px minmax(0, 1fr); padding-bottom: 48px; gap: 32px; }
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); align-self: start; display: flex; flex-direction: column; align-items: stretch; gap: 4px; background: none; border: 0; box-shadow: none; padding: 0; min-height: 0; }
  .nav-btn { flex-direction: row; gap: 12px; font-size: .95rem; font-weight: 600; padding: 10px 14px; justify-content: flex-start; }
  .nav-btn svg { width: 22px; height: 22px; padding: 0; border-radius: 0; }
  .nav-btn[aria-current="page"] svg { background: none; }
  .nav-btn:hover { background: var(--surface-2); color: var(--ink); }
  .nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
}

/* ---------- Escala tipográfica ---------- */
.page { display: grid; gap: 28px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.page-title { font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 800; letter-spacing: -.02em; }
.page-lead { color: var(--ink-soft); margin-top: 8px; max-width: 62ch; font-size: 1rem; }
.eyebrow { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
.section-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
.hint { color: var(--ink-soft); font-size: .86rem; }
.money-display { font-family: var(--font-display); font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1.05; overflow-wrap: anywhere; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { flex: 1; }
.neg { color: var(--cherry) !important; }
.pos { color: var(--pistachio); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid transparent; border-radius: 12px;
  padding: 10px 16px; font-weight: 600; font-size: .95rem; line-height: 1.2;
  background: var(--surface-2); color: var(--ink); text-decoration: none;
  transition: transform .12s ease, background-color .15s ease, border-color .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--cherry); color: var(--surface); }
.btn-text { background: none; border: 0; padding: 4px 2px; color: var(--accent); font-weight: 600; }
.btn-text:hover { text-decoration: underline; }
.btn-sm { padding: 7px 12px; font-size: .86rem; border-radius: 10px; }
.btn-lg { padding: 14px 20px; font-size: 1.02rem; border-radius: 14px; }
.btn-block { width: 100%; }
.btn-dashed { width: 100%; border: 1.5px dashed var(--line); background: transparent; color: var(--accent); padding: 12px; }
.btn-dashed:hover { border-color: var(--accent); background: var(--accent-soft); }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--ink-soft); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.danger:hover { color: var(--cherry); background: var(--cherry-soft); }

/* ---------- Formularios ---------- */
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .label { font-size: .84rem; font-weight: 600; color: var(--ink-soft); }
.input, .field input, .field select, .field textarea, .item input, .item select, .xrow input, .ing-price input, .pick-search {
  width: 100%; min-width: 0;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-sm);
  padding: 10px 12px; font-size: 1rem;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.field textarea { resize: vertical; min-height: 84px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="number"] { font-variant-numeric: tabular-nums; }
.money { position: relative; display: block; min-width: 0; }
.money > .cur { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); font-weight: 600; pointer-events: none; font-size: .95rem; }
.money > input { padding-left: calc(18px + var(--cur-w, 1ch)); }
.grid-2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid-3 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 600; color: var(--ink); }
.chip-btn:hover { border-color: var(--accent); }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepper { display: inline-grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); overflow: hidden; }
.stepper button { height: 42px; border: 0; background: var(--surface-2); font-size: 1.2rem; font-weight: 700; color: var(--ink); }
.stepper button:hover { background: var(--accent-soft); color: var(--accent); }
.stepper input { border: 0 !important; box-shadow: none !important; text-align: center; padding: 8px 4px !important; width: 100%; background: transparent; font-weight: 700; }

/* ---------- Chips de estado ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--pistachio-soft); color: var(--pistachio); }
.chip.low { background: var(--butter-soft); color: var(--butter); }
.chip.loss { background: var(--cherry-soft); color: var(--cherry); }
.chip.empty { background: var(--surface-2); color: var(--ink-soft); }
.tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--butter-soft); color: var(--butter); vertical-align: middle; white-space: nowrap; }

/* ---------- Inicio ---------- */
.hero-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .hero-grid { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } }
.hero-card { background: var(--accent-soft); border-radius: var(--r-lg); padding: 22px 24px; display: grid; gap: 6px; align-content: start; }
.hero-card .eyebrow { color: var(--accent); }
.hero-num { font-size: clamp(2.4rem, 7vw, 3.4rem); color: var(--accent); }
.hero-side { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .hero-side { grid-template-columns: 1fr; } }
.mini-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.mini-stat b { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.mini-stat small { color: var(--ink-soft); font-size: .8rem; }
.notices { display: grid; gap: 10px; }
.notice { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; }
.notice svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.notice p { flex: 1 1 220px; min-width: 0; font-size: .92rem; }
.notice.pink { background: var(--cherry-soft); border-color: transparent; }
.notice.pink svg { color: var(--cherry); }

/* ---------- Tarjetas de tortas ---------- */
.rgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); }
.rcard {
  text-align: left; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px 14px 12px;
  transition: border-color .15s ease, transform .15s ease;
}
.rcard:hover { border-color: var(--accent); transform: translateY(-2px); }
.rcard-art { background: var(--stage); border-radius: var(--r-md); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
.rcard-art svg { width: 100%; height: auto; }
.rcard-body { display: grid; gap: 4px; min-width: 0; }
.rcard-name { font-weight: 700; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
.rcard-meta { color: var(--ink-soft); font-size: .8rem; }
.rcard-price { font-size: 1.5rem; color: var(--ink); margin-top: 4px; }
.rcard-profit { font-size: .86rem; font-weight: 600; color: var(--pistachio); }
.rcard-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.empty-state { text-align: center; display: grid; justify-items: center; gap: 12px; padding: 40px 20px; }
.empty-state p { max-width: 44ch; color: var(--ink-soft); }
.search { max-width: 340px; width: 100%; }

/* ---------- Armar torta ---------- */
.ed-top { display: flex; align-items: center; gap: 8px; }
@media (max-width: 520px) { .ed-top .btn-label { display: none; } .ed-top .btn-sm { padding: 7px 10px; } }
.ed-title { display: grid; gap: 10px; }
.title-input {
  width: 100%; border: 0; border-bottom: 2px dashed transparent; background: transparent; padding: 2px 0;
  font-size: clamp(1.6rem, 4.5vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; border-radius: 0;
  resize: none; overflow: hidden; line-height: 1.15; field-sizing: content;
}
.title-input:hover { border-bottom-color: var(--line); }
.title-input:focus { box-shadow: none; border-bottom-color: var(--accent); }
.title-input::placeholder { color: var(--ink-faint); }
.ed-meta { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.ed-meta .stepper { width: 140px; }
.studio { display: grid; gap: 18px; align-items: start; }
.stage-col, .build-col { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 999px) {
  .stage-col { display: contents; }
  .stage { order: 1; }
  .build-col { order: 2; }
  .price-panel { order: 3; }
}
@media (min-width: 1000px) {
  .studio { grid-template-columns: minmax(330px, 400px) minmax(0, 1fr); gap: 24px; }
}
@media (min-width: 1000px) and (min-height: 780px) {
  .stage-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
}
.stage { position: relative; background: var(--stage); border-radius: var(--r-lg); padding: 16px 16px 18px; display: grid; gap: 12px; overflow: hidden; }
.stage-art { width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 32 / 27; }
.stage-art svg { width: 100%; height: 100%; display: block; overflow: visible; }
.stage-cap { text-align: center; color: var(--ink-soft); font-size: .88rem; min-height: 1.3em; }
.stage-float {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px;
  font-weight: 700; font-size: .86rem; box-shadow: var(--shadow); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
  animation: floatUp 2.2s ease forwards; pointer-events: none;
}
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px); } 12% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -14px); } }
.ck.enter { animation: drop .55s cubic-bezier(.2, .9, .3, 1.25) both; animation-delay: var(--d, 0s); }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite alternate; }
@keyframes flick { to { transform: scale(.82, .9); } }

.bsec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; display: grid; gap: 14px; min-width: 0; }
.bsec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bsec-total { font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.items { display: grid; }
.item {
  display: grid; gap: 8px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line);
  grid-template-columns: minmax(0, 1fr) 170px 92px 38px;
  grid-template-areas: "main qty cost rm";
}
.item:first-child { padding-top: 0; }
.item:last-child { border-bottom: 0; }
.item-main { grid-area: main; display: grid; gap: 2px; min-width: 0; }
.item-name { font-weight: 700; overflow-wrap: anywhere; }
.item-src { font-size: .8rem; color: var(--ink-soft); background: none; border: 0; padding: 0; text-align: left; }
button.item-src:hover { color: var(--accent); text-decoration: underline; }
.item-qty { grid-area: qty; display: grid; grid-template-columns: minmax(0, 1fr) 80px; gap: 6px; }
.item-qty input, .item-qty select { padding: 8px 10px; font-size: .95rem; }
.item-cost { grid-area: cost; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.item-cost.warn { color: var(--butter); font-size: .8rem; }
.item .icon-btn { grid-area: rm; }
@media (max-width: 640px) {
  .item { grid-template-columns: minmax(0, 1fr) minmax(76px, auto) 38px; grid-template-areas: "main main rm" "qty cost cost"; }
}
.xrow { display: grid; grid-template-columns: minmax(0, 1fr) 130px 38px; gap: 8px; align-items: center; }
.work-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
.work-grid .stepper { width: 100%; }
details.notes summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.notes summary::-webkit-details-marker { display: none; }
details.notes summary::after { content: "+"; font-size: 1.3rem; color: var(--ink-soft); }
details.notes[open] summary::after { content: "–"; }

/* ---------- Panel de precio ---------- */
.price-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 16px; min-width: 0; scroll-margin-top: 90px; }
.pp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; font-weight: 700; font-size: .86rem; color: var(--ink-soft); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.price-big { font-size: clamp(2.6rem, 9vw, 3.3rem); color: var(--accent); }
.price-input-wrap { position: relative; display: block; }
.price-input-wrap .cur { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--font-display); font-size: 1.6rem; color: var(--accent); pointer-events: none; }
.price-input {
  width: 100%; font-family: var(--font-display); font-size: clamp(2.2rem, 8vw, 2.8rem); color: var(--accent);

  function cakeTheme(r) {
