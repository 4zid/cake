<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} · Cuánto Cobro</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#FFE6EE">
<link rel="canonical" href="https://cuantocobro.app/{{SLUG}}">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
<style>
:root { --ink: #3A2228; --ink2: #7A5860; --btn: #C42F65; --accent: #A82756; --glaze: #FFE6EE; --soft: #FFF4F7; --line: #F5D5DF; --field: #B07F8D; --red: #C0292F; --redbg: #FFE3E3; --green: #2F6B40; --greenbg: #E5F4E8; --display: 'Bagel Fat One', Georgia, serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; overflow-x: clip; background: #FFFFFF; color: var(--ink); font: 17px/1.65 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.top { position: relative; background: var(--glaze); }
.top::after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 14px; background: radial-gradient(circle at 12px 0, var(--glaze) 11px, transparent 12px) 0 0 / 24px 14px repeat-x; }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { font-family: var(--display); font-size: 24px; line-height: 1; color: var(--accent); text-decoration: none; font-weight: 400; }
.top-in a:not(.brand) { min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; color: var(--ink2); text-decoration: none; }
main { max-width: 760px; margin: 0 auto; padding: 48px 24px 40px; }
h1 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6vw, 46px); line-height: 1.05; }
.updated { margin: 0 0 32px; font-size: 14px; color: var(--ink2); }
h2 { margin: 36px 0 10px; font-size: 21px; line-height: 1.3; font-weight: 800; }
p, li { color: var(--ink); }
ul { padding-left: 22px; }
li { margin: 6px 0; }
.lead { font-size: 19px; color: var(--ink2); }
.callout { margin: 24px 0; padding: 18px 20px; border-radius: 18px; background: var(--soft); }
.callout.ok { background: var(--greenbg); color: var(--green); }
.callout.err { background: var(--redbg); color: var(--red); }
.callout p { margin: 0; color: inherit; }
.callout p + p { margin-top: 8px; }
form { display: flex; flex-direction: column; gap: 16px; margin: 24px 0; padding: 24px; border-radius: 22px; border: 1.5px solid var(--line); }
label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700; }
label small { font-weight: 500; color: var(--ink2); }
input, textarea { width: 100%; min-height: 54px; padding: 12px 16px; border: 2px solid var(--field); border-radius: 14px; background: #FFFFFF; color: var(--ink); font: inherit; font-size: 17px; }
textarea { min-height: 96px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(196, 47, 101, .22); }
.btn { align-self: flex-start; min-height: 56px; padding: 0 26px; display: inline-flex; align-items: center; gap: 10px; border: 2px solid var(--ink); border-radius: 16px; background: var(--btn); color: #FFFFFF; box-shadow: 0 4px 0 var(--ink); font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn[disabled] { opacity: .7; cursor: progress; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; letter-spacing: .04em; }
footer { max-width: 760px; margin: 0 auto; padding: 28px 24px 48px; border-top: 1px solid var(--line); font-size: 15px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 8px 20px; }
footer a { min-height: 44px; display: inline-flex; align-items: center; color: var(--ink2); font-weight: 600; }
a, button, label { touch-action: manipulation; }
@media (max-width: 600px) { body { font-size: 16px; } .top-in, main, footer { padding-left: 16px; padding-right: 16px; } main { padding-top: 36px; } form { padding: 18px; } .btn { align-self: stretch; justify-content: center; } }
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="brand" href="/">Cuánto Cobro</a><a href="/">Volver al inicio</a></div></header>
<main>
{{BODY}}
</main>
<footer>
  <span>© Cuánto Cobro · Lautaro Lacaze · CUIT 20-41903976-5 · Río Grande, Tierra del Fuego</span>

  <a href="/privacidad">Privacidad</a>
  <a href="/arrepentimiento">Botón de arrepentimiento</a>
  <a href="mailto:hola@cuantocobro.app">hola@cuantocobro.app</a>
</footer>
</body>
</html>
