<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activa Dulce Cuenta</title>
<meta name="description" content="Activa Dulce Cuenta con el código de tu compra.">
<meta name="theme-color" content="#FFE6EE">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
<style>
:root { --ink: #3A2228; --ink2: #7A5860; --btn: #C42F65; --accent: #A82756; --glaze: #FFE6EE; --soft: #FFF4F7; --line: #F5D5DF; --field: #B07F8D; --red: #C0292F; --redbg: #FFE3E3; --green: #2F6B40; --greenbg: #E5F4E8; --display: 'Bagel Fat One', 'Cooper Black', Georgia, serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: #FFFFFF; color: var(--ink); font: 16px/1.5 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.art { position: relative; display: flex; flex-direction: column; padding: 40px 48px; background: var(--glaze); }
.art::after { content: ''; position: absolute; top: 0; bottom: 0; right: -12px; width: 12px; background: radial-gradient(circle at 0 10px, var(--glaze) 9.5px, transparent 10.5px) 0 0 / 12px 20px repeat-y; }
.brand { margin: 0; font-family: var(--display); font-size: 28px; line-height: 1; color: var(--accent); }
.cake { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
.cake svg { width: min(440px, 100%); height: auto; overflow: visible; animation: drop .7s cubic-bezier(.2, .9, .3, 1.25) both; }
main { display: flex; align-items: center; padding: 40px 48px 40px 60px; }
.box { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 20px; animation: rise .4s cubic-bezier(.2, .8, .3, 1) both; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1.05; text-wrap: balance; }
h1 span { color: var(--btn); }
.lead { margin: 0; font-size: 17px; color: var(--ink2); }
label { font-size: 15px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; }
input { width: 100%; height: 60px; padding: 0 16px; border: 2px solid var(--field); border-radius: 14px; background: #FFFFFF; color: var(--ink); font: inherit; font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; transition: border-color .15s, box-shadow .15s; }
input::placeholder { color: #C9A9B2; letter-spacing: .04em; }
input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(196, 47, 101, .25); }
input[aria-invalid="true"] { border-color: var(--red); }
.btn { min-height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid var(--ink); border-radius: 16px; background: var(--btn); color: #FFFFFF; box-shadow: 0 4px 0 var(--ink); font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn[disabled] { opacity: .7; cursor: progress; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .4); border-top-color: #FFFFFF; animation: spin .8s linear infinite; }
.msg { margin: 0; padding: 12px 14px; border-radius: 14px; font-size: 15px; font-weight: 600; }
.msg.err { background: var(--redbg); color: var(--red); }
.msg.ok { background: var(--greenbg); color: var(--green); }
.msg:empty { display: none; }
.help { margin: 0; font-size: 14px; color: var(--ink2); }
.help b { color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes drop { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.shake { animation: shake .35s ease; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
@media (max-width: 859px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .art { padding: 18px 16px 10px; }
  .art::after { top: 100%; bottom: auto; left: 0; right: 0; width: auto; height: 12px; background: radial-gradient(circle at 10px 0, var(--glaze) 9.5px, transparent 10.5px) 0 0 / 20px 12px repeat-x; }
  .brand { font-size: 22px; }
  .cake { padding: 8px 0; }
  .cake svg { width: 220px; }
  main { align-items: flex-start; padding: 32px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 32px; }
  .lead { font-size: 15px; }
}
</style>

e="#3A2228" stroke-width="4" stroke-linejoin="round"/><path d="M-8 -11 L-4 -18 L0 -13 L4 -18 L8 -11 Q0 -7 -8 -11 Z" fill="#5E9A4E" stroke="#3A2228" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="-4" cy="-2" rx="1.4" ry="2" fill="#FCE38A"/><ellipse cx="4" cy="-1" rx="1.4" ry="2" fill="#FCE38A"/><ellipse cx="0" cy="6" rx="1.4" ry="2" fill="#FCE38A"/></g><g transform="translate(212 101) scale(.6)"><path d="M0 -12 C-9 -13 -13 -6 -11 2 C-9 9 -4 14 0 16 C4 14 9 9 11 2 C13 -6 9 -13 0 -12 Z" fill="#E2384F" stroke="#3A2228" stroke-width="4" stroke-linejoin="round"/><path d="M-8 -11 L-4 -18 L0 -13 L4 -18 L8 -11 Q0 -7 -8 -11 Z" fill="#5E9A4E" stroke="#3A2228" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="-4" cy="-2" rx="1.4" ry="2" fill="#FCE38A"/><ellipse cx="4" cy="-1" rx="1.4" ry="2" fill="#FCE38A"/><ellipse cx="0" cy="6" rx="1.4" ry="2" fill="#FCE38A"/></g><g transform="translate(238 101) scale(.6)"><path d="M0 -12 C-9 -13 -13 -6 -11 2 C-9 9 -4 14 0 16 C4 14 9 9 11 2 C13 -6 9 -13 0 -12 Z" fill="#E2384F" stroke="#3A2228" stroke-width="4" stroke-linejoin="round"/><path d="M-8 -11 L-4 -18 L0 -13 L4 -18 L8 -11 Q0 -7 -8 -11 Z" fill="#5E9A4E" stroke="#3A2228" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="-4" cy="-2" rx="1.4" ry="2" fill="#FCE38A"/><ellipse cx="4" cy="-1" rx="1.4" ry="2" fill="#FCE38A"/><ellipse cx="0" cy="6" rx="1.4" ry="2" fill="#FCE38A"/></g></g><g data-k="vel"><rect x="130" y="71" width="8" height="36" rx="2" fill="#9FD3E6" stroke="#3A2228" stroke-width="2"/><path d="M132 79 L136 83 M132 89 L136 93" stroke="#FFFFFF" stroke-width="2" opacity=".7" fill="none"/><ellipse cx="134" cy="62" rx="4.2" ry="7" fill="#F5A524" stroke="#3A2228" stroke-width="1.6"><animate attributeName="ry" values="7;5.8;7" dur="1.1s" repeatCount="indefinite"/></ellipse><ellipse cx="134" cy="64" rx="1.8" ry="3" fill="#FFE08A"/><rect x="156" y="63" width="8" height="44" rx="2" fill="#F6C453" stroke="#3A2228" stroke-width="2"/><path d="M158 71 L162 75 M158 81 <main>
  <form class="box" id="form" novalidate>
    <h1>Activa tu <span>Dulce Cuenta</span></h1>
    <p class="lead">Escribe el código que te llegó por mail con tu compra. Lo haces una sola vez en cada dispositivo.</p>
    <div class="field">
      <label for="code">Tu código</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" maxlength="24" placeholder="DULCE-XXXX-XXXX-XXXX" aria-describedby="help msg" required>
    </div>
    <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
    <button class="btn" type="submit" id="go">Activar</button>
    <p class="help" id="help">Puedes usar el mismo código en tu teléfono y en tu computadora. ¿No lo encuentras? Busca <b>Dulce Cuenta</b> en tu correo o responde el mail de tu compra.</p>
  </form>
</main>
<script>
(() => {
  'use strict';
  const form = document.getElementById('form');
  const input = document.getElementById('code');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('go');
  const ALPHA = /[^23456789ABCDEFGHJKLMNPQRSTUVWXYZ]/g;
  const pretty = (raw) => {
    let s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.startsWith('DULCE')) s = s.slice(5);
    s = s.replace(ALPHA, '').slice(0, 12);
    const parts = [s.slice(0, 4), s.slice(4, 8), s.slice(8, 12)].filter(Boolean);
    return parts.length ? 'DULCE-' + parts.join('-') : '';
  };
  const device = () => {
    const k = 'dulce-cuenta:device';
    try {
      let d = localStorage.getItem(k);
      if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^\w-]/g, ''); localStorage.setItem(k, d); }
      return d;
    } catch (e) { return 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  };
  const show = (text, ok) => { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
  const q = new URLSearchParams(location.search).get('codigo');
  if (q) input.value = pretty(q);
  input.addEventListener('input', () => {
    const pos = input.selectionStart;
    input.value = input.value.toUpperCase();
    try { input.setSelectionRange(pos, pos); } catch (err) { /* sin cursor */ }
    input.removeAttribute('aria-invalid');
    msg.textContent = '';
  });
  input.addEventListener('blur', () => { input.value = pretty(input.value); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = pretty(input.value);
    input.value = code;
    if (code.length !== 20) {
      input.setAttribute('aria-invalid', 'true');
      show('El código tiene el formato DULCE-XXXX-XXXX-XXXX.');
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      input.focus();
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Activando…';
    try {
      const res = await fetch('/api/activar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, device: device() }), credentials: 'same-origin' });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        show('¡Listo! Abriendo tu Dulce Cuenta…', true);
        setTimeout(() => location.replace('/'), 500);
        return;
      }
      input.setAttribute('aria-invalid', 'true');
      show(data.message || 'No pudimos activar el código. Prueba de nuevo.');
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    } catch (err) {
      show('No hay conexión. Conéctate a internet para activar; después la app funciona sin conexión.');
    }
    btn.disabled = false;
    btn.textContent = 'Activar';
  });
  if (!q) input.focus();
})();
</script>
