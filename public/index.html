<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuánto Cobro</title>
<meta name="description" content="Calcula cuánto te cuesta cada torta, a cuánto venderla y cuánto ganas.">
<meta name="theme-color" content="#FFE6EE">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
<style>
/* Cuánto Cobro · rediseño. Blanco y rosa, tipografías Bagel Fat One (títulos y precios) y DM Sans (texto).
   Escritorio: menú lateral. Celular (< 860px): barra de botones abajo y "Armar torta" a pantalla completa. */
:root {
  --ink: #3A2228;
  --ink2: #7A5860;
  --btn: #C42F65;
  --accent: #A82756;
  --glaze: #FFE6EE;
  --pink: #FFE5EE;
  --soft: #FFF4F7;
  --stage: #FFF1F5;
  --line: #F5D5DF;
  --field: #B07F8D;
  --green: #2F6B40;
  --green2: #3F8452;
  --greenbg: #E5F4E8;
  --greenbg2: #F3FAF4;
  --amber: #845A08;
  --amberbg: #FFF3D6;
  --red: #C0292F;
  --redbg: #FFE3E3;
  --wood: #E3B98C;
  --display: 'Bagel Fat One', 'Cooper Black', 'Arial Rounded MT Bold', Georgia, serif;
  --font: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(214, 60, 114, .06), 0 12px 32px rgba(214, 60, 114, .10);
  --ease: cubic-bezier(.2, .8, .3, 1);
  --pop: cubic-bezier(.2, .9, .3, 1.25);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
h1, h2, h3, p { margin: 0; }
svg { flex: none; }
[hidden] { display: none !important; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 10px; }
.main:focus, .sheet:focus, [tabindex="-1"]:focus { outline: none; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 10px 16px; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 800; text-decoration: none; }
.skip:focus { top: 12px; }
.noscript { padding: 24px; text-align: center; }
.grow { flex: 1 1 auto; }
.muted { color: var(--ink2); }
.b { font-weight: 700; }
.acc { color: var(--accent); }
.pos { color: var(--green); }
.neg { color: var(--red) !important; }
.warn { color: var(--amber); }
.hint { font-size: 14px; color: var(--ink2); }
.hint:empty { display: none; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.stack-l { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.brand-word { font-family: var(--display); font-weight: 400; color: var(--accent); line-height: 1; }
.empty-line { padding: 24px 0; text-align: center; color: var(--ink2); }

/* ---------- Botones y controles ---------- */
.btn { position: relative; min-height: 52px; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--ink); border-radius: 16px; background: #FFFFFF; color: var(--ink); box-shadow: 0 4px 0 var(--ink); font-size: 16px; font-weight: 800; line-height: 1.2; text-decoration: none; white-space: nowrap; transition: transform .1s var(--ease), box-shadow .1s var(--ease), background-color .15s; -webkit-tap-highlight-color: transparent; }
.btn:hover { background: var(--soft); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn-primary { background: var(--btn); color: #FFFFFF; }
.btn-primary:hover { background: #B32A5C; }
.btn-danger { background: var(--red); color: #FFFFFF; }
.btn-danger:hover { background: #A82328; }
.btn-danger-o { color: var(--red); }
.btn-sm { min-height: 46px; padding: 0 16px; font-size: 15px; border-radius: 14px; }
.btn-lg { min-height: 54px; padding: 0 26px; font-size: 17px; }
.btn-block { width: 100%; }
.btn svg { width: 20px; height: 20px; }
.link { min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; border: 0; border-radius: 12px; background: none; color: var(--accent); font-size: 15px; font-weight: 700; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link-sm { min-height: 32px; padding: 0 4px; font-size: inherit; }
.icon-btn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink2); transition: background-color .15s, color .15s; }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 12px; background: var(--soft); flex: none; }
.seg button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink2); font-size: 14px; font-weight: 800; transition: background-color .2s, color .2s, box-shadow .2s; }
.seg button[aria-pressed="true"] { background: #FFFFFF; color: var(--ink); box-shadow: 0 1px 3px rgba(58, 34, 40, .14); }
.seg-dark { background: #FFFFFF; border-radius: 14px; }
.seg-dark button { color: var(--ink); border-radius: 11px; padding: 0 14px; }
.seg-dark button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; box-shadow: none; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 42px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--field); background: #FFFFFF; color: var(--ink); font-size: 14px; font-weight: 800; white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s, transform .1s; }
.pill:active { transform: scale(.96); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.pill-q { min-height: 44px; font-size: 15px; }
.pill-q[aria-pressed="true"] { background: var(--btn); border-color: var(--ink); }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; line-height: 1.4; white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--greenbg); color: var(--green); }
.chip.low { background: var(--amberbg); color: var(--amber); }
.chip.loss { background: var(--redbg); color: var(--red); }
.chip.empty { background: var(--soft); color: var(--ink2); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--amberbg); color: var(--amber); font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; }

/* Campos */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span:first-child { font-size: 15px; font-weight: 700; }
.inp { width: 100%; min-width: 0; height: 52px; padding: 0 14px; border: 2px solid var(--field); border-radius: 14px; background: #FFFFFF; color: var(--ink); font-size: 16px; font-weight: 600; transition: border-color .15s, box-shadow .15s; }
.inp:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(196, 47, 101, .25); }
textarea.inp { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.45; font-weight: 400; }
.inp-lg { height: 56px; font-size: 18px; }
.inp-xl { height: 58px; font-size: 24px; font-weight: 800; }
.select { position: relative; display: block; }
.select select { appearance: none; -webkit-appearance: none; padding-right: 48px; cursor: pointer; }
.select::after { content: ''; position: absolute; right: 18px; top: 50%; width: 9px; height: 9px; margin-top: -7px; border-right: 2.6px solid var(--ink); border-bottom: 2.6px solid var(--ink); transform: rotate(45deg); pointer-events: none; }
.money { position: relative; display: block; }
.money .cur { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--ink2); pointer-events: none; }
.money input { padding-left: calc(var(--cur-w, 1) * .62em + 26px); }
.money .suffix { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--ink2); font-size: 15px; pointer-events: none; }
.money-lg input { padding-right: 90px; }
.search { position: relative; display: block; flex: 1 1 220px; min-width: 0; max-width: 360px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink2); pointer-events: none; }
.search input { width: 100%; height: 46px; padding: 0 14px 0 40px; border: 2px solid var(--field); border-radius: 14px; background: #FFFFFF; font-size: 15px; }
.search input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(196, 47, 101, .25); }
.search-lg { max-width: none; flex: none; }
.search-lg input { height: 52px; font-size: 16px; }
.fs { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.fs legend { padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 800; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stepper { display: inline-grid; grid-template-columns: 46px minmax(56px, 76px) 46px; align-items: center; border: 2px solid var(--field); border-radius: 14px; background: #FFFFFF; overflow: hidden; }
.stepper button { height: 46px; border: 0; background: var(--soft); color: var(--ink); font-size: 20px; font-weight: 800; transition: background-color .15s; }
.stepper button:hover { background: var(--pink); }
.stepper input { width: 100%; height: 46px; border: 0; text-align: center; background: transparent; font-size: 18px; font-weight: 800; }
.stepper input:focus { outline: none; background: var(--soft); }
.stepper:focus-within { border-color: var(--ink); }
.range { width: 100%; height: 32px; margin: 0; accent-color: var(--btn); cursor: pointer; }
.card { display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 24px; border: 1.5px solid var(--line); background: #FFFFFF; }
.card h2 { font-size: 19px; font-weight: 800; line-height: 1.3; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------- Estructura ---------- */
.app { display: flex; min-height: 100vh; min-height: 100dvh; }
.side { position: sticky; top: 0; flex: none; width: 232px; height: 100vh; height: 100dvh; padding: 28px 14px 24px; display: flex; flex-direction: column; gap: 28px; border-right: 1px solid var(--line); background: #FFFFFF; overflow-y: auto; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 0 10px; border: 0; background: none; text-align: left; }
.brand .brand-word { font-size: 26px; }
.brand-sub { font-size: 13px; color: var(--ink2); }
.side-nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.nav-item { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; text-align: left; transition: background-color .2s, color .2s; }
.nav-item:hover { background: var(--soft); }
.nav-item[aria-current="page"] { background: var(--pink); color: var(--accent); }
.save-ind { display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; line-height: 1.3; color: var(--ink2); }
.save-ind i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--green2); transition: background-color .2s; }
.save-ind.is-saving i { background: var(--amber); animation: blink 1s ease-in-out infinite; }
.save-ind.is-error { color: var(--red); }
.save-ind.is-error i { background: var(--red); }
.main { flex: 1 1 auto; min-width: 0; padding: 32px 40px 56px; }
.page, .ed { max-width: 1120px; margin: 0 auto; animation: page-in .28s var(--ease) both; }
.page { display: flex; flex-direction: column; gap: 24px; }
.pbody { display: flex; flex-direction: column; gap: 24px; }
.phead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.phead > div:first-child { flex: 1 1 320px; min-width: 0; }
.phead h1 { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; }
.phead .lead { font-size: 16px; color: var(--ink2); max-width: 60ch; }
.lead b.warn { color: var(--amber); }
.ctl { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: var(--glaze); }
.ctl-stats { flex: 1 1 auto; font-size: 14.5px; }
.tabbar { display: none; }
.only-m { display: none !important; }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec-head h2, .sec-title { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }

/* ---------- Inicio ---------- */
.hero { position: relative; padding: 32px 36px; border-radius: 28px; background: var(--glaze); overflow: hidden; }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }
.hero-main { flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hello { margin-bottom: 10px; font-size: 22px; font-weight: 800; line-height: 1.25; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.big-num { font-family: var(--display); font-weight: 400; font-size: 68px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; animation: num-in .5s var(--pop) .08s both; }
.hero-sub { font-size: 15px; color: var(--ink2); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.hero-art { flex: none; width: 320px; margin: -8px -8px -36px 0; }
.local { position: relative; width: 100%; aspect-ratio: 340 / 300; container-type: inline-size; }
.local svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.local-sign { position: absolute; left: 23.5%; top: 19%; width: 53%; height: 12.7%; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--display); font-size: calc(var(--fs) / 340 * 100cqw); line-height: 1.02; color: var(--accent); overflow: hidden; overflow-wrap: anywhere; text-wrap: balance; }
.local-sign.is-empty { color: var(--field); }
.m-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.m-actions.one { grid-template-columns: 1fr; }
.notices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.notice { display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 18px; border-radius: 18px; background: var(--soft); animation: rise .35s var(--ease) both; }
.notice:nth-child(2) { animation-delay: .06s; }
.notice:nth-child(3) { animation-delay: .12s; }
.notice > svg { flex: none; color: var(--accent); }
.notice p { flex: 1 1 auto; font-size: 15px; line-height: 1.4; }
.notice.amber { background: var(--amberbg); }
.notice.amber > svg { color: var(--amber); }
.notice.red { background: var(--redbg); }
.notice.red > svg { color: var(--red); }
.notice-btn { flex: none; min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #FFFFFF; color: var(--accent); font-size: 15px; font-weight: 800; transition: transform .1s; }
.notice-btn:active { transform: scale(.96); }
.notice.amber .notice-btn { color: var(--amber); }
.notice.red .notice-btn { color: var(--red); }

/* Tarjetas de tortas */
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.rcard { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 18px; border-radius: 24px; border: 1.5px solid var(--line); background: #FFFFFF; color: var(--ink); text-align: left; transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; animation: rise .35s var(--ease) both; }
.rgrid > :nth-child(2) { animation-delay: .05s; }
.rgrid > :nth-child(3) { animation-delay: .1s; }
.rgrid > :nth-child(n+4) { animation-delay: .15s; }
.rcard:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: #F0C0D0; }
.rcard-art { height: 170px; border-radius: 18px; background: var(--stage); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
.rcard-art .cake-art { width: 176px; height: auto; }
.rcard:hover .rcard-art .cake-art { animation: wobble .6s var(--ease); }
.rcard-body { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; min-width: 0; }
.rcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.rcard-name { font-size: 17px; line-height: 1.3; }
.rcard-link { padding: 0; border: 0; background: none; color: inherit; font-weight: 700; text-align: left; cursor: pointer; }
.rcard-link::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.rcard-link:focus-visible { outline: none; }
.rcard:has(.rcard-link:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; }
.rcard { cursor: pointer; }
.rcard-menu { position: absolute; top: 20px; right: 20px; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 14px; background: rgba(255, 255, 255, .92); color: var(--ink); box-shadow: 0 1px 3px rgba(58, 34, 40, .12); transition: background-color .15s, transform .15s var(--pop); }
.rcard-menu:hover { background: #FFFFFF; transform: scale(1.06); }
.sh-cake { display: grid; place-items: center; width: 100%; height: 100%; }
.sh-cake .cake-art { width: 64px; height: auto; }
.menu-list { display: flex; flex-direction: column; gap: 4px; }
.menu-item { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border: 0; border-radius: 14px; background: #FFFFFF; color: var(--ink); font-size: 16px; font-weight: 700; text-align: left; transition: background-color .15s; }
.menu-item:hover { background: var(--soft); }
.menu-item svg { color: var(--ink2); }
.menu-item.danger, .menu-item.danger svg { color: var(--red); }
.btn-quiet { border-color: transparent; box-shadow: none; background: transparent; color: var(--ink2); }
.btn-quiet:hover { background: var(--soft); color: var(--ink); }
.btn-quiet:active { transform: scale(.97); box-shadow: none; }
.ed-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.ed-more { display: none; }
.s-del { white-space: nowrap; }
.srow { cursor: pointer; transition: background-color .15s; }
.srow:hover { background: var(--soft); }
body:has(.overlay) .toast { top: calc(16px + env(safe-area-inset-top)); bottom: auto; }
.rcard-meta { font-size: 13.5px; color: var(--ink2); }
.rcard-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 6px; }
.price-d { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.gain { font-size: 14px; font-weight: 700; color: var(--green); }
.gain.neg { color: var(--red); }
.gain.muted { color: var(--ink2); font-weight: 500; }
.rcard-warn { margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--amber); }
.rcard-new { min-height: 300px; align-items: center; justify-content: center; gap: 10px; padding: 18px; border: 2px dashed var(--field); color: var(--accent); text-align: center; }
.rcard-new b { font-size: 17px; }
.rcard-new .muted { font-size: 14px; max-width: 26ch; }
.rcard-new-art .cake-art { width: 150px; height: auto; }
.rcard-new:hover { border-color: var(--accent); background: var(--stage); }
.empty-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 36px 24px; border-radius: 24px; border: 2px dashed var(--field); text-align: center; }
.empty-card h2 { font-size: 20px; font-weight: 800; }
.empty-card p { max-width: 46ch; color: var(--ink2); }

/* ---------- Despensa ---------- */
.shelves { display: flex; flex-direction: column; gap: 28px; }
.shelf-group { display: flex; flex-direction: column; gap: 8px; }
.shelf-group h2 { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.shelf { display: flex; flex-direction: column; margin-bottom: 10px; }
.shelf-items, .shelf-tags { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 14px; padding: 0 14px; }
.shelf-items { align-items: end; }
.shelf-btn { display: flex; justify-content: center; padding: 6px 0 0; border: 0; border-radius: 16px; background: transparent; transition: transform .2s var(--pop); }
.shelf-btn .ing-art { width: 100%; max-width: 96px; height: auto; }
.shelf-btn:hover { transform: translateY(-4px) rotate(-2deg); }
.plank { height: 16px; border-radius: 8px; background: var(--wood); border: 2.5px solid var(--ink); box-shadow: 0 8px 0 rgba(58, 34, 40, .06); }

/* ---------- Ventas ---------- */

.s-thumb, .ts-thumb { flex: none; display: grid; place-items: center; }

.s-name { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.s-name small { font-size: 13px; color: var(--ink2); }
.s-price b { font-weight: 700; }
.s-gain { font-weight: 800; }
.s-del { width: 56px; }
.topsold { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 24px; background: var(--soft); }

/* ---------- Ajustes ---------- */

.snap-list li span { display: flex; flex-direction: column; }
.snap-list small { color: var(--ink2); font-size: 13px; }

/* ---------- Armar torta ---------- */
.ed { display: flex; flex-direction: column; gap: 20px; max-width: 1120px; }
.ed-top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.back { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px 0 4px; border: 0; border-radius: 12px; background: none; color: var(--ink2); font-size: 15px; font-weight: 700; }

.ed-grid { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }

.ed-title { width: 100%; min-height: 52px; padding: 6px 2px; border: 0; border-bottom: 2px dashed var(--line); border-radius: 0; background: transparent; color: var(--ink); font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; resize: none; overflow: hidden; }
.ed-title:focus { outline: none; border-bottom-color: var(--btn); }

.stage { position: relative; height: 420px; border-radius: 28px; background: var(--stage); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; overflow: hidden; }

.stage-art .cake-art { width: 100%; height: auto; display: block; overflow: visible; }
.badge-ing { position: absolute; left: 16px; top: 16px; display: flex; flex-direction: column; padding: 8px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: var(--shadow); line-height: 1.2; }

.badge-ing b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.badge-count { position: absolute; right: 16px; top: 16px; padding: 7px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13.5px; font-weight: 700; color: var(--ink2); }
.stage-float { position: absolute; left: 50%; top: 84px; padding: 8px 16px; border-radius: 999px; background: var(--ink); color: #FFFFFF; font-size: 15px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); animation: float-tag 2.2s ease-out forwards; pointer-events: none; }
.pricebar { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 20px; border: 1.5px solid var(--line); }
.bar-l { flex: 1 1 auto; display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.bar-l small, .bar-r small { font-size: 13px; font-weight: 700; color: var(--ink2); }

.bar-r { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }

.ed-panel { display: flex; flex-direction: column; gap: 20px; animation: fade-in .25s var(--ease) both; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 5px; border-radius: 18px; background: var(--soft); }
.step { min-width: 0; min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 6px; border: 0; border-radius: 14px; background: transparent; color: var(--ink2); font-size: 15px; font-weight: 800; white-space: nowrap; transition: background-color .2s, box-shadow .2s, color .2s; }

/* Estantes del editor */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border-radius: 18px; border: 2px solid var(--line); background: #FFFFFF; text-align: center; transition: transform .15s var(--ease), border-color .2s, background-color .2s; }
.tile:hover { border-color: var(--field); transform: translateY(-2px); }
.tile:active { transform: scale(.97); }
.tile .ing-art { width: 60px; height: 60px; }
.tile:hover .ing-art { animation: wobble .5s var(--ease); }
.tile.on { border-color: var(--green2); background: var(--greenbg2); }

.tile-name { font-size: 13.5px; font-weight: 700; line-height: 1.2; }

.pl-btn { flex: none; min-width: 104px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); background: #FFFFFF; color: var(--accent); font-size: 14px; font-weight: 800; }

.rl-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }

/* Extras y trabajo */
.xgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 12px; }
.xcard { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; border: 2px solid var(--line); background: #FFFFFF; transition: border-color .2s, background-color .2s; }

.xtxt { display: flex; flex-direction: column; line-height: 1.25; }

/* Precio */

.price-input input { width: 100%; height: 72px; padding: 0 16px 0 calc(var(--cur-w, 1) * 22px + 26px); border: 2px solid var(--btn); border-radius: 18px; background: #FFFFFF; color: var(--accent); font-family: var(--display); font-size: 42px; font-variant-numeric: tabular-nums; }

.btn-row { display: flex; flex-wrap: wrap; gap: 12px; }

.bar { display: flex; gap: 2px; height: 18px; border-radius: 999px; overflow: hidden; background: #FFFFFF; }

.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

.more-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

/* ---------- Hojas y ventanas ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(58, 34, 40, .36); animation: fade-in .2s ease both; }
.sheet { position: relative; width: 100%; max-width: 520px; max-height: calc(100dvh - 48px); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 64px rgba(58, 34, 40, .22); animation: sheet-in .28s var(--pop) both; }

.sum-box { display: flex; flex-direction: column; padding: 14px 16px; border-radius: 16px; background: var(--pink); line-height: 1.35; }

/* ---------- Animaciones ---------- */
@keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes num-in { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-4deg); } 60% { transform: rotate(3deg); } }
@keyframes drop-in { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
@keyframes spin-in { from { opacity: 0; transform: rotate(-30deg) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes swing { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes float-tag { 0% { opacity: 0; transform: translate(-50%, 12px); } 15% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; transform: translate(-50%, -4px); } 100% { opacity: 0; transform: translate(-50%, -18px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* Gráfico de torta del onboarding: la porción rosa es la ganancia. */
function pieHTML(margin, size) {
  const m = clamp(margin, 0, 100) / 100;
  const cx = 100, cy = 100, r = 78;
  const pt = (deg, rr, ox, oy) => { const a = deg * Math.PI / 180; return [(cx + ox + rr * Math.cos(a)).toFixed(2), (cy + oy + rr * Math.sin(a)).toFixed(2)]; };

  const ox = 9 * Math.cos(am), oy = 9 * Math.sin(am);
  const p0 = pt(a0, r, ox, oy), p1 = pt(a1, r, ox, oy);
  const pieSlice = 'M' + (cx + ox).toFixed(2) + ' ' + (cy + oy).toFixed(2) + ' L' + p0[0] + ' ' + p0[1] + ' A' + r + ' ' + r + ' 0 ' + (m > 0.5 ? 1 : 0) + ' 1 ' + p1[0] + ' ' + p1[1] + ' Z';
  const q0 = pt(a1, r, 0, 0), q1 = pt(a0 + 360, r, 0, 0);
  const pieRest = 'M' + cx + ' ' + cy + ' L' + q0[0] + ' ' + q0[1] + ' A' + r + ' ' + r + ' 0 ' + (1 - m > 0.5 ? 1 : 0) + ' 1 ' + q1[0] + ' ' + q1[1] + ' Z';
  let dots = '';
  for (let i = 0; i < 12; i++) {
    const deg = -90 + 15 + i * 30;
    const inSlice = deg < a1;
    const p = pt(deg, 62, inSlice ? ox : 0, inSlice ? oy : 0);
    dots += `<circle cx="${p[0]}" cy="${p[1]}" r="5.5" fill="#FFFFFF" stroke="${INK}" stroke-width="1.6"/>`;
  }
  return `<svg class="pie-art" viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="De cada $100 que cobras, $${Math.round(margin)} son ganancia" style="overflow:visible"><circle cx="100" cy="104" r="80" fill="${INK}" opacity=".08"/><path d="${pieRest}" fill="#F6DDB0" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><path d="${pieSlice}" fill="#F2A7BB" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}

      if (e.shiftKey && (document.activeElement === f[0] || document.activeElement === dlg)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  };
  document.addEventListener('keydown', onKey, true);
  el.addEventListener('mousedown', (e) => { if (e.target === el) close(); });
  el.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
  setTimeout(() => { const f = $('[data-autofocus]', dlg); (f || dlg).focus({ preventScroll: true }); }, 0);
  return { el, dlg, close };
}

function routeFromHash() {
  const m = /^#\/(torta\/([\w-]+)|recipes|ingredients|sales|settings|home)$/.exec(location.hash);
  if (!m) return null;
  return m[2] ? { view: 'recipe', id: m[2], step: 'ing' } : { view: m[1] };
}
const routePath = () => '#/' + (route.view === 'recipe' ? 'torta/' + route.id : route.view);
function go(v, params = {}, { replace = false } = {}) {
  if (saveTimer) persist();
  route = { view: v, ...params };
  try { history[replace ? 'replaceState' : 'pushState']({ route }, '', routePath()); } catch (e) { /* sin historial */ }
  render();
  window.scrollTo({ top: 0 });
  view.focus({ preventScroll: true });
}
window.addEventListener('popstate', (e) => {
  /* Los saltos dentro de la página (como "Saltar al contenido") no son rutas: se ignoran. */
  const next = e.state && e.state.route ? e.state.route : routeFromHash();
  if (!next) return;
  route = next;
  if (!(e.state && e.state.route)) { try { history.replaceState({ route }, '', routePath()); } catch (err) { /* sin historial */ } }
  $$('.overlay').forEach((o) => o.remove());
  overlays = 0; lockScroll(false);
  if (onbEl) lockScroll(true);
  render();
});
function render() {
  if (route.view === 'recipe' && !findRecipe(route.id)) route = { view: 'recipes' };
  const navKey = route.view === 'recipe' ? 'recipes' : route.view;
  $$('[data-nav]').forEach((b) => { if (b.dataset.nav === navKey) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  document.body.classList.toggle('in-editor', route.view === 'recipe');
  const sub = $('#brand-sub');
  if (sub) sub.textContent = state.settings.business || 'Costos y ganancias';
  view.innerHTML = (views[route.view] || views.home)();
  if (route.view === 'recipe') initEditor();
  if (route.view === 'settings') loadLicense();
  setSaveState(saveTimer ? 'saving' : 'saved');
}

/* Recalcula todo lo que se ve sin tocar los campos que se están escribiendo. */
function updateOut() {
  const r = cur();
  if (!r) return;
  const c = calc(r);
  const s = state.settings;
  const step = stepOf();
  const m = clamp(num(r.margin), 0, 90);
  const loss = c.profit < 0;
  const n = recipeCount(r);
  const bar = step === 'pre'
    ? { label: loss ? 'Pierdes' : 'Ganas', val: money(Math.abs(c.profit)), tone: loss ? 'neg' : 'pos' }
    : { label: 'Precio sugerido', val: money(c.suggested), tone: 'acc' };
  const out = {
    ing: money(c.ingredients), cost: money(c.cost), suggested: money(c.suggested), price: money(c.price),
    profitAbs: money(Math.abs(c.profit)), realPct: c.price > 0 ? `${Math.round(c.marginReal * 100)}% del precio` : '',
    profitLabel: loss ? 'Con este precio pierdes' : 'Con este precio ganas',
    perPortion: money(c.perPortion), portions: String(c.portions), marginPct: `${Math.round(m)}%`,
    labor: money(c.labor), rate: money(num(s.hourlyRate)),
    count: plural(n, 'ingrediente', 'ingredientes'), itemCount: String(r.items.length),
    barLabel: bar.label, barVal: bar.val,
    profitHint: c.cost <= 0 ? 'Agrega ingredientes para calcular.' : loss ? `Te faltan ${money(-c.profit)} para cubrir el costo.` : c.labor > 0 ? `Además de pagarte ${money(c.labor)} por tu tiempo.` : 'Ojo: no estás contando tu tiempo de trabajo.',
    rateHint: num(s.hourlyRate) > 0 ? '' : 'Pon cuánto vale tu hora. Si lo dejas en 0, estás regalando tu trabajo.',
    missingHint: c.missing ? `${plural(c.missing, 'ingrediente no tiene', 'ingredientes no tienen')} precio: el costo real es mayor.` : ''
  };
  $$('[data-out]', view).forEach((el) => { const k = el.dataset.out; if (k in out) el.textContent = out[k]; });
  $$('[data-out="barVal"]', view).forEach((el) => { el.className = bar.tone; });
  const pb = $('#profit-box'); if (pb) pb.classList.toggle('is-loss', loss);
  for (const l of r.items) {
    const el = $(`[data-linecost="${l.id}"]`, view);
    if (!el) continue;
    const li = lineInfo(l);
    el.classList.toggle('warn', li.missing);
    el.textContent = li.missing ? 'Sin precio' : money(li.cost);
  }
  const barEl = $('#bar');
  if (barEl) {
    const base = Math.max(c.price, c.cost) || 1;
    const segs = [['ing', 'Ingredientes', c.ingredients], ['ext', 'Extras', c.extras], ['lab', 'Tu trabajo', c.labor], ['ovh', 'Gastos de cocina', c.overhead], ['pro', 'Ganancia', Math.max(c.profit, 0)]];
    barEl.innerHTML = segs.map(([k, , v]) => `<span style="width:${(v / base) * 100}%;background:${SEG[k]}"></span>`).join('');
    $('#legend').innerHTML = segs.map(([k, name, v]) => `<li><i style="background:${SEG[k]}" aria-hidden="true"></i><span>${name}</span><b>${money(v)}</b><small>${c.price > 0 ? pct(v / c.price) : ''}</small></li>`).join('');
    const top = [...c.lines].sort((a, b) => b.cost - a.cost).slice(0, 3).filter((x) => x.cost > 0);
    const max = top.length ? top[0].cost : 1;
    $('#top-ings').innerHTML = top.length ? `<h3>Lo que más pesa</h3>${top.map((x) => `<div class="top-row">${ingArt(x.kind, 40)}<div><span>${esc(x.name)}</span><span class="track" aria-hidden="true"><i style="width:${Math.round((x.cost / max) * 100)}%"></i></span></div><b>${money(x.cost)}</b></div>`).join('')}` : '';
  }
}
function fitTitle() {
  const t = $('#r-name');
  if (!t) return;
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
}
function touch(r) { r.updatedAt = Date.now(); r.sample = false; save(); }
function repaintPanel() {
  const r = cur();
  const p = $('#ed-panel');
  if (!r || !p) return;
  p.innerHTML = panelHTML(r, stepOf());
  updateOut();
}
function refreshCake(r, floatText, animate = true) {
  mountCake($('#cake-art'), cakeProps(r), animate);
  if (floatText) {
    const stage = $('.stage');
    if (!stage) return;
    $$('.stage-float', stage).forEach((e) => e.remove());
    const f = document.createElement('div');
    f.className = 'stage-float';
    f.setAttribute('aria-hidden', 'true');
    f.textContent = floatText;
    stage.appendChild(f);
    setTimeout(() => f.remove(), 2300);
  }
}
function setStep(step) {
  const r = cur();
  if (!r || !STEPS.some((s) => s[0] === step)) return;
  route.step = step;
  try { history.replaceState({ route }, '', routePath()); } catch (e) { /* sin historial */ }
  $('#steps').innerHTML = stepsHTML(step);
  $('#ed-next').innerHTML = nextHTML(step);
  $('#ed-bar').innerHTML = barHTML(step, true);
  $('.pricebar').innerHTML = barHTML(step);
  const p = $('#ed-panel');
  p.innerHTML = panelHTML(r, step);
  p.scrollTop = 0;
  if (!isMobile()) $('.ed-right').scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' });
  updateOut();
}
const nextStep = () => { const i = STEPS.findIndex((s) => s[0] === stepOf()); if (i < STEPS.length - 1) setStep(STEPS[i + 1][0]); };

function newRecipe() {
  const s = state.settings;

    hours: '', overhead: s.overhead || '', margin: s.margin ?? 40, price: null, notes: '', sample: false,
    createdAt: Date.now(), updatedAt: Date.now()
  };

/* ======================= Hoja "¿Cuánto usas?" ======================= */
/* spec.ing: ingrediente de la despensa; spec.preset: { name, packQty, packUnit, cat } para uno que todavía no está. */
function qtySheet(r, spec) {
  const ing = spec.ing || null;
  const p = spec.preset || {};
  const line = ing ? r.items.find((l) => l.ingId === ing.id) : null;
  const st = {
    name: ing ? ing.name : (p.name || ''), packQty: ing ? ing.packQty : (p.packQty || 1), packUnit: ing ? ing.packUnit : (p.packUnit || 'kg'),
    price: ing ? ing.price : '', cat: ing ? ingCat(ing) : (p.cat || guessCat(p.name || '')),
    qty: line ? line.qty : '', unit: line ? line.unit : null, editBuy: false
  };
  const type = () => UNITS[st.packUnit].type;
  const fixUnit = () => { if (!st.unit || !UNITS[st.unit] || UNITS[st.unit].type !== type()) st.unit = BY_TYPE[type()][0]; };
  const showBuy = () => !ing || st.editBuy || !(num(ing.price) > 0);
  const m = openSheet({ label: ing ? ing.name : 'Ingrediente nuevo', html: '<div class="sh-body"></div>' });
  const box = $('.sh-body', m.el);

  const paint = () => {
    fixUnit();
    const kind = guessKind(st.name || '');
    const buy = showBuy();
    const sub = ing && num(ing.price) > 0 && !st.editBuy
      ? `Lo compras a <b>${money(ing.price)}</b> el paquete de ${packLabel(ing)} <button type="button" class="link link-sm" data-editbuy>Cambiar precio</button>`
      : ing ? 'Todavía no tiene precio. Cárgalo abajo.' : 'Nuevo en tu despensa';
    box.innerHTML = `${sheetHead({ art: ingArt(kind, 70), title: ing ? ing.name : (st.name || 'Ingrediente nuevo'), sub })}
      ${buy ? `<fieldset class="fs"><legend>¿Cómo lo compras?</legend>
        ${!ing ? `<label class="field"><span>Nombre</span><input class="inp" id="pk-name" value="${esc(st.name)}" maxlength="40" autocomplete="off"></label>` : ''}
        <div class="grid-3">
          <label class="field"><span>Paquete de</span><input class="inp" id="pk-pqty" type="number" min="0" step="any" inputmode="decimal" value="${esc(st.packQty)}"></label>
          <label class="field"><span>Unidad</span><span class="select"><select class="inp" id="pk-punit">${Object.keys(UNITS).map((k) => `<option value="${k}" ${k === st.packUnit ? 'selected' : ''}>${UNITS[k].label}</option>`).join('')}</select></span></label>
          <label class="field"><span>Pagaste</span>${moneyInput('pk-price', 'class="inp"', num(st.price) || '')}</label>
        </div>
        ${!ing ? `<label class="field"><span>¿Para qué parte de la torta?</span><span class="select"><select class="inp" id="pk-cat">${CATS.map(([k, l]) => `<option value="${k}" ${k === st.cat ? 'selected' : ''}>${l}</option>`).join('')}</select></span></label>` : ''}
        <p class="hint" id="pk-per"></p></fieldset>` : ''}
      <fieldset class="fs"><legend>¿Cuánto usas en esta torta?</legend>
        <div class="pills">${QUICK[type()].map(([q, u]) => `<button type="button" class="pill pill-q" data-quick="${q}" data-unit="${u}">${fmtQty(q)}${u === 'u' ? '' : ' ' + UNITS[u].label}</button>`).join('')}</div>
        <div class="qty-wrap"><label class="sr" for="pk-qty">Cantidad</label><input id="pk-qty" class="inp inp-xl" type="number" min="0" step="any" inputmode="decimal" value="${esc(st.qty)}" placeholder="0">
          <label class="sr" for="pk-unit">Unidad</label><span class="qty-unit"><select id="pk-unit">${BY_TYPE[type()].map((k) => `<option value="${k}" ${k === st.unit ? 'selected' : ''}>${UNITS[k].label}</option>`).join('')}</select></span></div>
      </fieldset>
      <p class="sum-box" id="pk-out" aria-live="polite"></p>
      <div class="sh-actions"><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" data-confirm>${line ? 'Guardar cantidad' : 'Agregar a la torta'}</button></div>`;
    preview();
    const f = $(!ing && !String(st.name).trim() ? '#pk-name' : buy && !(num(st.price) > 0) ? '#pk-price' : '#pk-qty', box);
    if (f) setTimeout(() => f.focus({ preventScroll: true }), 30);
  };
  const tmpIng = () => (showBuy() ? { packQty: num(st.packQty), packUnit: st.packUnit, price: num(st.price), type: type() } : ing);
  const preview = () => {
    const t = tmpIng();
    const uc = unitCost(t);
    const per = $('#pk-per', box);
    if (per) per.textContent = uc > 0 ? `Te sale a ${perLabel(t)}.` : 'Si no sabes el precio ahora, puedes cargarlo después.';
    const add = num(st.qty) * UNITS[st.unit].f * uc;
    const prev = line ? lineInfo(line).cost : 0;
    const after = calc(r).ingredients - prev + add;
    $('#pk-out', box).innerHTML = uc > 0
      ? `<span>Suma <b>${money(add)}</b> a esta torta</span><small>Los ingredientes pasan a costar ${money(after)}</small>`
      : '<span>Sin precio no podemos calcular cuánto suma.</span>';
    $$('[data-quick]', box).forEach((b) => b.setAttribute('aria-pressed', String(num(b.dataset.quick) === num(st.qty) && b.dataset.unit === st.unit)));
  };
  box.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'pk-name') { st.name = t.value; if (!st.catTouched) { st.cat = guessCat(t.value); const c = $('#pk-cat', box); if (c) c.value = st.cat; } }
    if (t.id === 'pk-pqty') st.packQty = t.value;
    if (t.id === 'pk-price') st.price = t.value;
    if (t.id === 'pk-qty') st.qty = t.value;
    preview();
  });
  box.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'pk-punit') { st.packUnit = t.value; paint(); }
    if (t.id === 'pk-unit') { st.unit = t.value; preview(); }
    if (t.id === 'pk-cat') { st.cat = t.value; st.catTouched = true; }
  });
  box.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('[data-editbuy]')) { st.editBuy = true; paint(); return; }
    const qb = t.closest('[data-quick]');
    if (qb) { st.qty = num(qb.dataset.quick); st.unit = qb.dataset.unit; $('#pk-qty', box).value = st.qty; $('#pk-unit', box).value = st.unit; preview(); }
    if (t.closest('[data-confirm]')) confirm();
  });
  box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); confirm(); } });

  function confirm() {
    const name = (ing ? ing.name : String(st.name || '')).trim();
    if (!name) { toast('Ponle un nombre al ingrediente'); $('#pk-name', box)?.focus(); return; }
    if (!(num(st.packQty) > 0)) { toast('Indica el tamaño del paquete'); $('#pk-pqty', box)?.focus(); return; }
    if (!(num(st.qty) > 0)) { toast('Indica cuánto usas'); $('#pk-qty', box)?.focus(); return; }
    let target = ing;
    const t = type();
    if (!target) {
      target = state.ingredients.find((i) => norm(i.name) === norm(name));
      if (!target) {
        target = { id: uid(), name, packQty: num(st.packQty), packUnit: st.packUnit, price: num(st.price), type: t, cat: st.cat, updatedAt: Date.now(), sample: false };
        state.ingredients.push(target);
      }
    } else if (showBuy()) {
      const changed = num(st.price) !== num(target.price) || num(st.packQty) !== num(target.packQty) || st.packUnit !== target.packUnit;
      Object.assign(target, { packQty: num(st.packQty), packUnit: st.packUnit, price: num(st.price), type: t });
      if (changed) { target.updatedAt = Date.now(); target.sample = false; }
      state.recipes.forEach((rr) => rr.items.forEach((l) => { if (l.ingId === target.id && UNITS[l.unit].type !== t) l.unit = BY_TYPE[t][0]; }));
    }
    let l = r.items.find((x) => x.ingId === target.id);
    const isNew = !l;
    if (l) { l.qty = num(st.qty); l.unit = st.unit; }
    else { l = { id: uid(), ingId: target.id, qty: num(st.qty), unit: st.unit }; r.items.push(l); }
    if (CAT_KEYS.includes(ingCat(target))) ui.cat = ingCat(target);
    touch(r);
    m.close();
    const li = lineInfo(l);
    repaintPanel();
    refreshCake(r, `${isNew ? '+ ' : ''}${shortName(target.name)}${li.cost > 0 ? ` · ${money(li.cost)}` : ''}`);
  }
  paint();
}

/* "Otro ingrediente": sugerencias comunes o uno nuevo. */
function pickerSheet(r) {
  const st = { q: '' };
  const cat = CAT_KEYS.includes(ui.cat) ? ui.cat : 'masa';
  const m = openSheet({
    label: 'Agregar ingrediente',
    html: `${sheetHead({ title: 'Agregar ingrediente', sub: 'Elige uno común o escribe el tuyo.' })}
      <label class="search search-lg"><span class="sr">Buscar o escribir un ingrediente</span>${I.search}<input type="search" id="pick-q" placeholder="Buscar o escribir uno nuevo" autocomplete="off" data-autofocus></label>
      <div class="pick-list" id="pick-list"></div>`
  });
  const list = $('#pick-list', m.el);
  const paint = () => {
    const q = norm(st.q.trim());
    const mineNames = new Set(state.ingredients.map((i) => norm(i.name)));
    const mine = q ? state.ingredients.filter((i) => norm(i.name).includes(q)) : [];
    const common = COMMON.filter(([n]) => !mineNames.has(norm(n)) && (!q || norm(n).includes(q)));
    const sorted = q ? common : [...common.filter((c) => c[3] === cat), ...common.filter((c) => c[3] !== cat)];
    const exact = mineNames.has(q) || COMMON.some(([n]) => norm(n) === q);
    const catName = (k) => CATS.find((c) => c[0] === k)[1];
    let html = '';
    if (mine.length) html += `<p class="pick-group">En tu despensa</p>` + mine.map((i) => `<button type="button" class="pick" data-pick="ing" data-id="${i.id}">${ingArtFor(i, 40)}<span><b>${esc(i.name)}</b><small>${catName(ingCat(i))} · ${perShort(i)}</small></span></button>`).join('');
    if (sorted.length) html += `<p class="pick-group">Comunes en pastelería</p>` + sorted.slice(0, q ? 20 : 14).map(([n, qty, u, c, k]) => `<button type="button" class="pick" data-pick="common" data-name="${esc(n)}">${ingArt(k, 40)}<span><b>${esc(n)}</b><small>${catName(c)} · paquete de ${packLabel({ packQty: qty, packUnit: u })}</small></span><span class="pick-plus" aria-hidden="true">+</span></button>`).join('');
    if (q && !exact) html += `<button type="button" class="pick pick-new" data-pick="new">${ingArt(guessKind(st.q), 40)}<span><b>Crear “${esc(st.q.trim())}”</b><small>Ingrediente nuevo en tu despensa</small></span></button>`;
    if (!html) html = `<p class="empty-line">Ya tienes todos los comunes. Escribe el nombre para crear uno nuevo.</p>`;
    list.innerHTML = html;
  };
  const qi = $('#pick-q', m.el);
  qi.addEventListener('input', () => { st.q = qi.value; paint(); });
  qi.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const f = $('.pick', list); if (f) f.click(); } });
  list.addEventListener('click', (e) => {
    const b = e.target.closest('[data-pick]');
    if (!b) return;
    m.close();
    const k = b.dataset.pick;
    if (k === 'ing') qtySheet(r, { ing: findIng(b.dataset.id) });
    else if (k === 'common') { const c = COMMON.find(([n]) => n === b.dataset.name); qtySheet(r, { preset: { name: c[0], packQty: c[1], packUnit: c[2], cat: c[3] } }); }
    else qtySheet(r, { preset: { name: st.q.trim(), packQty: 1, packUnit: 'kg', cat: guessCat(st.q) || cat } });
  });
  paint();
}

/* ======================= Ingrediente de la despensa ======================= */
function ingredientSheet(ing) {
  const isNew = !ing;
  const d = ing ? { ...ing, cat: ingCat(ing) } : { name: '', packQty: 1, packUnit: 'kg', price: '', cat: 'masa' };
  const used = ing ? usedIn(ing.id) : [];
  const unitOpts = Object.keys(UNITS).map((k) => `<option value="${k}" ${k === d.packUnit ? 'selected' : ''}>${UNITS[k].label}</option>`).join('');
  const catOpts = CATS.map(([k, l]) => `<option value="${k}" ${k === d.cat ? 'selected' : ''}>${l}</option>`).join('');
  const more = `<label class="field"><span>Nombre</span><input class="inp" id="ing-name" value="${esc(d.name)}" maxlength="40" placeholder="Ej: Harina 0000" autocomplete="off" ${isNew ? 'data-autofocus' : ''}></label>
    <div class="grid-2">
      <label class="field"><span>Paquete de</span><input class="inp" id="ing-qty" type="number" min="0" step="any" inputmode="decimal" value="${esc(d.packQty)}"></label>
      <label class="field"><span>Unidad</span><span class="select"><select class="inp" id="ing-unit">${unitOpts}</select></span></label>
    </div>
    <label class="field"><span>Parte de la torta</span><span class="select"><select class="inp" id="ing-cat">${catOpts}</select></span></label>`;
  const m = openSheet({
    label: isNew ? 'Nuevo ingrediente' : `Editar ${ing.name}`,
    html: `${sheetHead({ art: ingArt(isNew ? 'otro' : ingKind(ing), 70), title: isNew ? 'Nuevo ingrediente' : ing.name, sub: isNew ? 'Súmalo a tu despensa.' : `Paquete de ${packLabel(ing)} · ${ing.sample ? 'precio de ejemplo' : 'actualizado ' + ago(ing.updatedAt)}` })}
      <form id="ing-form" class="stack" novalidate>
        ${isNew ? more : ''}
        <label class="field"><span class="b">¿Cuánto pagaste la última vez?</span>${moneyInput('ing-price', `class="inp inp-xl" ${isNew ? '' : 'data-autofocus'}`, num(d.price) || '')}</label>
        <p class="sum-box" id="ing-preview" aria-live="polite"></p>
        ${used.length ? `<p class="hint">Se usa en ${used.map((r) => `“${esc(r.name || 'Torta sin nombre')}”`).join(', ')}. Al guardar, esas tortas se recalculan.</p>` : ''}
        ${isNew ? '' : `<details class="more"><summary>Cambiar nombre, paquete o parte de la torta</summary><div class="stack">${more}</div></details>`}
        <button type="submit" hidden></button>
      </form>
      <div class="sh-actions">${isNew ? '' : `<button type="button" class="btn btn-danger-o left" data-del aria-label="Eliminar ingrediente">${I.trash}<span>Eliminar</span></button>`}<button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" data-save>${isNew ? 'Agregar' : 'Guardar precio'}</button></div>`
  });
  const f = $('#ing-form', m.el);
  const preview = () => {
    const tmp = { packQty: num($('#ing-qty', m.el).value), packUnit: $('#ing-unit', m.el).value, price: num($('#ing-price', m.el).value) };
    tmp.type = UNITS[tmp.packUnit].type;
    $('#ing-preview', m.el).innerHTML = unitCost(tmp) > 0 ? `<span>Te sale <b>${money(unitCost(tmp) * PER[tmp.type].f)}</b> por ${PER[tmp.type].label}.</span><small>Tus tortas se recalculan solas.</small>` : '<span>Completa el paquete y el precio para ver cuánto te sale.</span>';
  };
  f.addEventListener('input', preview);
  f.addEventListener('change', preview);
  preview();
  const submit = (e) => {
    if (e) e.preventDefault();
    const name = $('#ing-name', m.el).value.trim();
    if (!name) { const det = $('details.more', m.el); if (det) det.open = true; $('#ing-name', m.el).focus(); toast('Ponle un nombre al ingrediente'); return; }
    const packUnit = $('#ing-unit', m.el).value;
    const packQty = num($('#ing-qty', m.el).value);
    if (!(packQty > 0)) { const det = $('details.more', m.el); if (det) det.open = true; $('#ing-qty', m.el).focus(); toast('Indica el tamaño del paquete'); return; }
    const price = num($('#ing-price', m.el).value);
    const type = UNITS[packUnit].type;
    const cat = $('#ing-cat', m.el).value;
    if (isNew) {
      state.ingredients.push({ id: uid(), name, packQty, packUnit, price, type, cat, updatedAt: Date.now(), sample: false });
    } else {
      const changed = price !== num(ing.price) || packQty !== num(ing.packQty) || packUnit !== ing.packUnit;
      Object.assign(ing, { name, packQty, packUnit, price, type, cat });
      if (changed) { ing.updatedAt = Date.now(); ing.sample = false; }
      state.recipes.forEach((r) => r.items.forEach((l) => { if (l.ingId === ing.id && UNITS[l.unit].type !== type) l.unit = BY_TYPE[type][0]; }));
    }
    save();
    m.close();
    toast(isNew ? 'Ingrediente agregado' : used.length ? `Guardado. ${plural(used.length, 'torta recalculada', 'tortas recalculadas')}` : 'Precio guardado');
    render();
  };
  f.addEventListener('submit', submit);
  $('[data-save]', m.el).addEventListener('click', submit);
  const del = $('[data-del]', m.el);
  if (del) del.addEventListener('click', async () => {
    m.close();
    const ok = await confirmBox({
      title: `¿Eliminar “${ing.name}”?`,
      text: used.length ? `Se usa en ${plural(used.length, 'torta', 'tortas')}. Ahí quedará marcado como “ingrediente eliminado” para que lo reemplaces.` : 'No se usa en ninguna torta.',
      ok: 'Eliminar', danger: true
    });
    if (!ok) return;
    state.ingredients = state.ingredients.filter((i) => i.id !== ing.id);
    save(); render(); toast('Ingrediente eliminado');
  });
}

          <label class="field"><span>Te costó</span>${moneyInput('sale-cost', 'class="inp"', editing ? editing.cost : '')}</label>
        </div>
        <div class="grid-2">
          <label class="field"><span>Fecha</span><input class="inp" id="sale-date" type="date" value="${editing ? editing.date : todayISO()}"></label>
          <label class="field"><span>Cliente (opcional)</span><input class="inp" id="sale-client" placeholder="Ej: Laura" maxlength="40" autocomplete="off" value="${editing ? esc(editing.client) : ''}"></label>
        </div>
        <p class="sum-box" id="sale-preview" aria-live="polite"></p>
        <label class="check" id="sale-update-wrap" hidden><input type="checkbox" id="sale-update" checked><span id="sale-update-text"></span></label>
        <button type="submit" hidden></button>
      </form>
      <div class="sh-actions">${editing ? `<button type="button" class="btn btn-danger-o left" data-del aria-label="Borrar venta">${I.trash}<span>Borrar</span></button>` : ''}<button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" data-save>Guardar venta</button></div>`
  });
  const sel = $('#sale-recipe', m.el);
  /* Si la vendió a otro precio, se ofrece usarlo como precio de la torta. */
  const priceDiffers = () => {
    const r = findRecipe(sel.value);
    const price = num($('#sale-price', m.el).value);
    return r && price > 0 && Math.round(price * 100) !== Math.round(calc(r).price * 100) ? r : null;
  };
  const preview = () => {
    const p = num($('#sale-price', m.el).value) - num($('#sale-cost', m.el).value);
    $('#sale-preview', m.el).innerHTML = `<span>${p < 0 ? 'Pierdes' : 'Ganas'} <b class="${p < 0 ? 'neg' : 'pos'}">${money(Math.abs(p))}</b> con esta venta</span>`;
    const r = priceDiffers();
    $('#sale-update-wrap', m.el).hidden = !r;
    if (r) $('#sale-update-text', m.el).innerHTML = `Usar <b>${money(num($('#sale-price', m.el).value))}</b> como precio de “${esc(r.name || 'Torta sin nombre')}” de ahora en adelante <small>Ahora figura a ${money(calc(r).price)}.</small>`;
  };
  /* Al elegir una torta se completan precio y costo; al editar se respetan los valores guardados. */
  const fill = (fromUser) => {
    const r = findRecipe(sel.value);
    $('#sale-title-wrap', m.el).hidden = !!r;
    if (r && (fromUser || !editing)) {
      const c = calc(r);
      $('#sale-price', m.el).value = Math.round(c.price * 100) / 100 || '';
      $('#sale-cost', m.el).value = Math.round(c.cost * 100) / 100 || '';
    }
    preview();
  };
  sel.addEventListener('change', () => fill(true));
  $('#sale-form', m.el).addEventListener('input', preview);
  fill(false);
  const submit = (e) => {
    if (e) e.preventDefault();
    const r = findRecipe(sel.value);
    const name = r ? (r.name || 'Torta sin nombre') : $('#sale-title', m.el).value.trim();
    if (!name) { $('#sale-title', m.el).focus(); toast('Escribe qué vendiste'); return; }
    const price = num($('#sale-price', m.el).value);
    if (!(price > 0)) { $('#sale-price', m.el).focus(); toast('Indica cuánto cobraste'); return; }
    const date = $('#sale-date', m.el).value || todayISO();
    const data = { date, recipeId: r ? r.id : '', title: name, client: $('#sale-client', m.el).value.trim(), price, cost: num($('#sale-cost', m.el).value) };
    if (editing) Object.assign(editing, data);
    else state.sales.push({ id: uid(), ...data });
    const updatePrice = priceDiffers() && $('#sale-update', m.el).checked;
    if (updatePrice) { r.price = price; r.updatedAt = Date.now(); r.sample = false; }
    save(); m.close();
    ui.month = date.slice(0, 7);
    const done = editing ? 'Venta actualizada' : 'Venta anotada';
    toast(updatePrice ? `${done}. “${r.name || 'Torta sin nombre'}” ahora vale ${money(price)}` : done);
    if (route.view === 'recipe') { repaintPanel(); updateOut(); }
    else render();
  };
  $('#sale-form', m.el).addEventListener('submit', submit);
  $('[data-save]', m.el).addEventListener('click', submit);
  const del = $('[data-del]', m.el);
  if (del) del.addEventListener('click', async () => {
    m.close();
    const ok = await confirmBox({ title: '¿Borrar esta venta?', text: 'Se quita del resumen del mes.', ok: 'Borrar', danger: true });
    if (!ok) return;
    state.sales = state.sales.filter((x) => x.id !== editing.id); save(); render();
    toast('Venta borrada');
  });
}

/* ======================= Respaldo ======================= */
const backupPayload = () => ({ app: 'dulce-cuenta', version: 1, exportedAt: new Date().toISOString(), data: state });
function exportFile() {
  persist();
  try {
    const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cuanto-cobro-respaldo-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    state.settings.lastExport = Date.now();
    save(); render();
    toast('Respaldo descargado');
  } catch (e) {
    copyBackup();
  }
}
function copyBackup() {
  const text = JSON.stringify(backupPayload());
  const done = () => { state.settings.lastExport = Date.now(); save(); render(); toast('Respaldo copiado. Pégalo en una nota o mail.'); };
  const fallback = () => {
    const m = openSheet({
      label: 'Copia este texto',
      html: `${sheetHead({ title: 'Copia este texto' })}<p class="sh-text">Selecciona todo el texto y cópialo. Guárdalo en una nota o mándatelo por mail.</p><textarea id="bk-text" class="inp" rows="8" readonly>${esc(text)}</textarea><div class="sh-actions"><button type="button" class="btn btn-primary" data-close>Listo</button></div>`
    });
    const ta = $('#bk-text', m.el); ta.focus(); ta.select();
    state.settings.lastExport = Date.now(); save();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
function parseBackup(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return null; }
  const data = obj && obj.data && typeof obj.data === 'object' ? obj.data : obj;
  if (!data || typeof data !== 'object' || !(Array.isArray(data.recipes) || Array.isArray(data.ingredients))) return null;
  return normalize(data);
}
async function restoreData(data, source) {
  const ok = await confirmBox({
    title: '¿Restaurar este respaldo?',
    text: `Tiene ${plural(data.recipes.length, 'torta', 'tortas')}, ${plural(data.ingredients.length, 'ingrediente', 'ingredientes')} y ${plural(data.sales.length, 'venta', 'ventas')}. Reemplaza lo que tienes ahora; antes guardamos una copia automática por si acaso.`,
    ok: 'Restaurar'
  });
  if (!ok) return;
  makeSnapshot('import');
  data.settings.onboarded = true;
  state = data;
  fmtCache.clear();
  persist();
  closeOnboarding();
  go('home');
  toast(source === 'snap' ? 'Volviste a la copia elegida' : 'Respaldo restaurado');
}
function pasteBackup() {
  const m = openSheet({
    label: 'Pegar respaldo',
    html: `${sheetHead({ title: 'Pegar respaldo' })}<p class="sh-text">Pega acá el texto que copiaste con “Copiar como texto”.</p><label class="sr" for="paste-text">Texto del respaldo</label><textarea id="paste-text" class="inp" rows="8" placeholder='{"app":"dulce-cuenta", …}' data-autofocus></textarea><div class="sh-actions"><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" data-ok>Continuar</button></div>`
  });
  $('[data-ok]', m.el).addEventListener('click', () => {
    const data = parseBackup($('#paste-text', m.el).value.trim());
    if (!data) { toast('Ese texto no es un respaldo de Cuánto Cobro'); return; }
    m.close();
    restoreData(data, 'paste');
  });
}
function readBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const data = parseBackup(String(reader.result));
    if (!data) { toast('Ese archivo no es un respaldo de Cuánto Cobro'); return; }
    restoreData(data, 'file');
  };
  reader.readAsText(file);
}
/* Desde la bienvenida: archivo o texto. */
function restoreChooser() {
  const m = openSheet({
    label: 'Recuperar tus datos',
    html: `${sheetHead({ title: 'Recuperar tus datos', sub: 'Usa el respaldo que descargaste o copiaste antes.' })}
      <div class="choice-list">
        <label class="choice" for="onb-file"><span class="choice-ico">${ico(ICON_D.up, { s: 26 })}</span><span><b>Elegir el archivo</b><small>El .json que descargaste desde Ajustes.</small></span></label>
        <input id="onb-file" type="file" accept=".json,application/json,text/plain" class="sr">
        <button type="button" class="choice" data-paste><span class="choice-ico">${ico(ICON_D.copy, { s: 26 })}</span><span><b>Pegar el texto</b><small>Si lo guardaste en una nota o en un mail.</small></span></button>
      </div>`
  });
  $('#onb-file', m.el).addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; m.close(); readBackupFile(f); });
  $('[data-paste]', m.el).addEventListener('click', () => { m.close(); pasteBackup(); });
}
