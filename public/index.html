/* Usa los ingredientes de la despensa si ya existen (con el precio de la usuaria);
   los que falten se crean con precios inventados y marcados como ejemplo. */
const SAMPLE_PRICES = { 'Harina 0000': 1200, 'Azúcar': 1400, 'Huevos': 3600, 'Manteca': 2800, 'Cacao amargo': 3900, 'Leche': 1500, 'Polvo de hornear': 600, 'Esencia de vainilla': 2000, 'Dulce de leche repostero': 6500, 'Crema de leche': 3200, 'Chocolate cobertura': 3300, 'Frutillas': 4000 };
function addSample() {
  const now = Date.now();
  const get = (name) => {
    const existing = state.ingredients.find((i) => norm(i.name) === norm(name));
    if (existing) {
      if (!(num(existing.price) > 0)) Object.assign(existing, { price: SAMPLE_PRICES[name], sample: true });
      return existing;
    }
    const [, packQty, packUnit, cat] = COMMON.find(([n]) => n === name);
    const i = { id: uid(), name, packQty, packUnit, price: SAMPLE_PRICES[name], type: UNITS[packUnit].type, cat, updatedAt: now, sample: true };
    state.ingredients.push(i);
    return i;
  };
  const line = (name, qty, unit) => ({ id: uid(), ingId: get(name).id, qty, unit });
  const r = {
    id: uid(), name: 'Chocolate con dulce de leche', portions: 12,
    items: [line('Harina 0000', 300, 'g'), line('Azúcar', 250, 'g'), line('Huevos', 4, 'u'), line('Manteca', 200, 'g'), line('Cacao amargo', 60, 'g'), line('Dulce de leche repostero', 500, 'g'), line('Chocolate cobertura', 150, 'g'), line('Frutillas', 250, 'g')],
    extras: [{ id: uid(), name: 'Caja', cost: 1800 }, { id: uid(), name: 'Bandeja', cost: 900 }],
    hours: 3, overhead: state.settings.overhead || 1500, margin: state.settings.margin || 40, price: null,
    notes: 'Ejemplo: horno a 180 °C durante 40 minutos, molde de 24 cm.',
    sample: true, createdAt: now, updatedAt: now
  };
  state.recipes.push(r);
  save();
  return r;
}

/* ======================= Bienvenida (5 pasos) ======================= */
let onbEl = null;
function closeOnboarding() {
  if (!onbEl) return;
  onbEl.remove();
  onbEl = null;
  lockScroll(false);
}
function onboarding() {
  closeOnboarding();
  const s = state.settings;
  const draft = { business: s.business, currency: s.currency, hourlyRate: s.hourlyRate || '', margin: [30, 40, 50, 60].includes(s.margin) ? s.margin : 40, prices: {} };
  STARTER.forEach(([n]) => { const i = state.ingredients.find((x) => norm(x.name) === norm(n)); if (i && !i.sample && num(i.price) > 0) draft.prices[n] = i.price; });
  let step = 1;
  const el = document.createElement('div');
  el.className = 'onb';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', 'Bienvenida a Cuánto Cobro');
  document.body.appendChild(el);
  onbEl = el;
  lockScroll(true);

  const symFor = () => { try { const loc = (CURRENCIES.find((c) => c[0] === draft.currency) || [])[2] || 'es'; return new Intl.NumberFormat(loc, { style: 'currency', currency: draft.currency }).formatToParts(1).find((x) => x.type === 'currency').value; } catch (e) { return '$'; } };
  const filled = () => STARTER.filter(([n]) => num(draft.prices[n]) > 0).length;

  const art = () => {
    if (step === 1) return `<div class="onb-cake">${cakeHTML({ masa: 3, relleno: true, cobertura: 'rosa', sabor: 'vainilla', rellenoSabor: 'frutilla', frutillas: true, velas: true }, 'Torta con frutillas y velas')}${PRICE_TAG}</div>`;
    if (step === 2) return `<div class="onb-local">${localHTML(draft.business, false)}</div>`;
    if (step === 3) {
      const sym = esc(symFor());
      return `<div class="onb-pie">${pieHTML(draft.margin, 200)}<div class="pie-legend">
        <div><span><i class="sw-pink" aria-hidden="true"></i>Tu ganancia</span><b class="acc">${draft.margin}%</b></div>
        <div><span><i class="sw-cream" aria-hidden="true"></i>Lo que cuesta</span><b>${100 - draft.margin}%</b></div></div><span class="sr">De cada ${sym}100 que cobras, ${sym}${draft.margin} son ganancia.</span></div>`;
    }
    if (step === 4) {
      const rows = [STARTER.slice(0, 4), STARTER.slice(4, 7), STARTER.slice(7, 10)];
      return `<div class="onb-shelves" role="img" aria-label="Despensa con ${filled()} de 10 ingredientes con precio">${rows.map((row) => `<div class="onb-shelf"><div class="onb-shelf-items">${row.map(([n, , , , k]) => `<span class="${num(draft.prices[n]) > 0 ? 'is-on' : ''}">${ingArt(k)}</span>`).join('')}</div><div class="plank"></div></div>`).join('')}</div>`;
    }
    return `<div class="onb-local">${localHTML(draft.business, true)}</div>`;
  };

  const content = () => {
    const sym = esc(symFor());
    if (step === 1) return `<div class="stack-l">
        <div class="stack-s"><h1 class="onb-h1" tabindex="-1">¿A cuánto vendo <span>esta torta?</span></h1>
        <p class="onb-lead">Arma tu torta ingrediente por ingrediente y te decimos cuánto te cuesta, a cuánto venderla y cuánto te queda.</p></div>
        <ol class="how">
          <li><span class="how-ico">${ingArt('harina', 48)}</span><span><b>Carga lo que pagas</b><span class="only-d">Un kilo de harina, una docena de huevos: tus precios reales.</span></span></li>
          <li><span class="how-ico">${cakeHTML({ masa: 2, relleno: true, cobertura: 'chocolate', sabor: 'chocolate', frutillas: false, velas: false }, '')}</span><span><b>Arma la torta</b><span class="only-d">Suma ingredientes, extras y tus horas. La ves crecer en pantalla.</span></span></li>
          <li><span class="how-ico">${TAG_SMALL}</span><span><b>Elige tu precio</b><span class="only-d">Usa el sugerido o pon el tuyo y mira cuánto ganas.</span></span></li>
        </ol></div>`;
    if (step === 2) return `<form class="stack-l" data-onb-form novalidate>
        <div class="stack-s"><h2 class="onb-h2" tabindex="-1">¿Cómo se llama tu pastelería?</h2><p class="onb-lead">Es opcional. Mira cómo queda en el cartel mientras escribes.</p></div>
        <label class="field"><span>Nombre de tu pastelería</span><input class="inp inp-lg" id="onb-business" value="${esc(draft.business)}" maxlength="40" placeholder="Ej: Dulces de Ana" autocomplete="organization"></label>
        <label class="field"><span>Moneda</span><span class="select"><select class="inp inp-lg" id="onb-currency">${CURRENCIES.map((c) => `<option value="${c[0]}" ${c[0] === draft.currency ? 'selected' : ''}>${c[1]} (${c[0]})</option>`).join('')}</select></span></label>
      </form>`;
    if (step === 3) return `<form class="stack-l" data-onb-form novalidate>
        <div class="stack-s"><h2 class="onb-h2" tabindex="-1">Tu tiempo también cuesta</h2><p class="onb-lead only-d">Con esto calculamos el precio sugerido de cada torta.</p></div>
        <label class="field"><span>¿Cuánto vale una hora de tu trabajo?</span>
          <span class="money money-lg" style="--cur-w:${sym.length}"><span class="cur" aria-hidden="true">${sym}</span><input class="inp inp-lg" id="onb-rate" type="number" min="0" step="any" inputmode="decimal" value="${esc(draft.hourlyRate)}" placeholder="Ej: 4000" aria-describedby="onb-rate-hint"><span class="suffix" aria-hidden="true">por hora</span></span>
          <small class="hint" id="onb-rate-hint">Piensa cuánto cobrarías por hora en otro trabajo.</small></label>
        <fieldset class="fs"><legend>¿Cuánto quieres ganar sobre el precio?</legend>
          <div class="mchips">${[30, 40, 50, 60].map((v) => `<button type="button" class="mchip" data-margin="${v}" aria-pressed="${draft.margin === v}">${v}%</button>`).join('')}</div>
          <p class="onb-calc" aria-live="polite">De cada <b>${sym}100</b> que cobras, <b class="acc">${sym}${draft.margin}</b> son ganancia.</p>
          <small class="hint">Entre 30% y 50% es lo habitual en pastelería casera.</small></fieldset>
      </form>`;
    if (step === 4) {
      const f = filled();
      return `<div class="stack">
        <div class="stack-s"><h2 class="onb-h2" tabindex="-1">¿Cuánto pagas por esto?</h2><p class="onb-lead">Pon lo que pagaste la última vez. Lo que no uses, déjalo vacío.</p>
          <div class="progress"><span class="track" aria-hidden="true"><i style="width:${f * 10}%"></i></span><span class="progress-txt" aria-live="polite">${f} de 10 cargados</span></div></div>
        <div class="starter">${STARTER.map(([n, q, u, , k]) => `<div class="st-card${num(draft.prices[n]) > 0 ? ' on' : ''}">
          ${num(draft.prices[n]) > 0 ? `<span class="tile-chk" aria-hidden="true">${I.check}</span>` : ''}
          <span class="st-art">${ingArt(k)}</span>
          <span class="st-txt"><label for="onb-p-${k}">${esc(n)}</label><small>paquete de ${packLabel({ packQty: q, packUnit: u })}</small></span>
          <span class="money" style="--cur-w:${sym.length}"><span class="cur" aria-hidden="true">${sym}</span><input class="inp" id="onb-p-${k}" type="number" min="0" step="any" inputmode="decimal" data-price="${esc(n)}" value="${esc(draft.prices[n] || '')}" placeholder="0"></span>
        </div>`).join('')}</div></div>`;
    }
    const name = draft.business.trim();
    return `<div class="stack-l">
      <div class="stack-s"><h2 class="onb-h2" tabindex="-1">${name ? `¡Todo listo, ${esc(name)}!` : '¡Todo listo!'}</h2>
        <p class="onb-lead">Tus datos se guardan en este navegador, sin cuentas ni contraseñas. Desde Ajustes puedes descargar un respaldo.</p></div>
      <div class="choice-list">
        <button type="button" class="choice choice-main" data-finish="build"><span class="choice-art">${cakeHTML({ masa: 0, frutillas: false, velas: false }, '')}</span><span><b>Armar mi primera torta</b><small>Empiezas vacía y la ves crecer con cada ingrediente.</small></span></button>
        <button type="button" class="choice" data-finish="sample"><span class="choice-art">${cakeHTML({ masa: 3, relleno: true, cobertura: 'chocolate', sabor: 'chocolate', frutillas: true, velas: false }, '')}</span><span><b>Ver una torta de ejemplo</b><small>Una de chocolate ya armada, para ver cómo funciona.</small></span></button>
      </div></div>`;
  };

  const foot = () => {
    if (step === 5) return '';
    const cta = step === 1 ? 'Empezar' : step === 4 && filled() === 0 ? 'Lo completo después' : 'Siguiente';
    return `${step === 1 ? '<button type="button" class="btn btn-alt" data-restore>Ya tengo un respaldo</button>' : '<button type="button" class="btn only-d" data-prev>Atrás</button>'}
      <span class="grow"></span><button type="button" class="btn btn-primary btn-lg" data-next>${cta}${I.arrow}</button>`;
  };

  const paint = () => {
    el.className = `onb s${step}`;
    el.innerHTML = `<div class="onb-top">
        ${step > 1 ? `<button type="button" class="icon-btn onb-back" data-prev aria-label="Volver al paso anterior">${I.back}</button>` : ''}
        <span class="onb-count">Paso ${step} de 5</span>
        <div class="segs" aria-hidden="true">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= step ? 'on' : ''}"></i>`).join('')}</div>
        <span class="grow"></span>
        ${step < 5 ? '<button type="button" class="link" data-skip>Saltar</button>' : ''}
      </div>
      <div class="onb-art"><p class="brand-word">Cuánto Cobro</p><div class="onb-art-in">${art()}</div></div>
      <div class="onb-content"><div class="onb-inner">${content()}</div></div>
      <div class="onb-foot">${foot()}</div>`;
    const h = $('h1, h2', el);
    if (h) h.focus({ preventScroll: true });
    el.scrollTop = 0;
    $('.onb-content', el).scrollTop = 0;
  };
  const readForm = () => {
    const b = $('#onb-business', el); if (b) draft.business = b.value.trim();
    const c = $('#onb-currency', el); if (c) draft.currency = c.value;
    const r = $('#onb-rate', el); if (r) draft.hourlyRate = r.value;
    $$('[data-price]', el).forEach((i) => { draft.prices[i.dataset.price] = i.value; });
  };
  const goStep = (n) => { readForm(); step = clamp(n, 1, 5); paint(); };
  const finish = (mode) => {
    readForm();
    Object.assign(state.settings, { business: draft.business, currency: draft.currency, hourlyRate: num(draft.hourlyRate), margin: draft.margin, onboarded: true });
    fmtCache.clear();
    for (const [n, q, u, cat] of STARTER) {
      const p = num(draft.prices[n]);
      if (!(p > 0)) continue;
      const existing = state.ingredients.find((x) => norm(x.name) === norm(n));
      if (existing) Object.assign(existing, { price: p, sample: false, updatedAt: Date.now() });
      else state.ingredients.push({ id: uid(), name: n, packQty: q, packUnit: u, price: p, type: UNITS[u].type, cat, updatedAt: Date.now(), sample: false });
    }
    closeOnboarding();
    persist();
    if (mode === 'sample') { const r = addSample(); persist(); go('recipe', { id: r.id, step: 'ing' }); }
    else if (mode === 'build') newRecipe();
    else go('home');
  };
  el.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('[data-next]')) goStep(step + 1);
    else if (t.closest('[data-prev]')) goStep(step - 1);
    else if (t.closest('[data-skip]')) finish('skip');
    else if (t.closest('[data-finish]')) finish(t.closest('[data-finish]').dataset.finish);
    else if (t.closest('[data-restore]')) restoreChooser();
    else if (t.closest('[data-margin]')) {
      readForm();
      draft.margin = Number(t.closest('[data-margin]').dataset.margin);
      paint();
      const b = $(`[data-margin="${draft.margin}"]`, el); if (b) b.focus();
    }
  });
  el.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'onb-business') { draft.business = t.value; $('.onb-art-in', el).innerHTML = art(); }
    if (t.dataset.price) {
      draft.prices[t.dataset.price] = t.value;
      const card = t.closest('.st-card');
      const on = num(t.value) > 0;
      card.classList.toggle('on', on);
      const chk = $('.tile-chk', card);
      if (on && !chk) card.insertAdjacentHTML('afterbegin', `<span class="tile-chk" aria-hidden="true">${I.check}</span>`);
      if (!on && chk) chk.remove();
      const f = filled();
      $('.progress .track i', el).style.width = f * 10 + '%';
      $('.progress-txt', el).textContent = `${f} de 10 cargados`;
      $('.onb-art-in', el).innerHTML = art();
      const cta = $('[data-next]', el);
      if (cta) cta.firstChild.textContent = f === 0 ? 'Lo completo después' : 'Siguiente';
    }
  });
  el.addEventListener('change', (e) => { if (e.target.id === 'onb-currency') { draft.currency = e.target.value; } });
  el.addEventListener('submit', (e) => { e.preventDefault(); goStep(step + 1); });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); goStep(step + 1); }
  });
  paint();
}

/* ======================= Licencia (solo informativo) ======================= */
async function loadLicense() {
  const box = $('#lic-box');
  if (!box) return;
  try {
    const res = await fetch('/api/licencia', { credentials: 'same-origin', cache: 'no-store' });
    if (!res.ok) throw new Error('sin licencia');
    const d = await res.json();
    if (!document.contains(box)) return;
    box.hidden = false;
    $('#lic-info', box).innerHTML = `Código <b>${esc(d.code)}</b>${d.email ? ` · ${esc(d.email)}` : ''}. Activado en ${plural(d.devices, 'dispositivo', 'dispositivos')} de ${d.maxDevices}.`;
    const g = d.guarantee || {};
    if (g.refundable) {
      const until = new Date(g.until).toLocaleDateString('es', { day: 'numeric', month: 'long' });
      $('#lic-g-text', box).innerHTML = `<b>Garantía de ${g.days} días.</b> Hasta el ${esc(until)} puedes pedir la devolución: Mercado Pago te devuelve el pago completo y la app se desactiva.`;
      $('#lic-guarantee', box).hidden = false;
    }
  } catch (e) { /* abierta sin servidor (por ejemplo, desde un archivo) */ }
}

/* ======================= Tortas: duplicar, eliminar y menú ======================= */
function duplicateRecipe(id) {
  const r = findRecipe(id);
  if (!r) return;
  const copy = JSON.parse(JSON.stringify(r));
  copy.id = uid(); copy.name = (r.name || 'Torta') + ' (copia)'; copy.sample = false;
  copy.items.forEach((l) => (l.id = uid())); copy.extras.forEach((x) => (x.id = uid()));
  copy.createdAt = copy.updatedAt = Date.now();
  state.recipes.push(copy); save();
  go('recipe', { id: copy.id, step: 'ing' });
  toast('Torta duplicada. Ya puedes cambiarla.');
}
async function deleteRecipe(id) {
  const r = findRecipe(id);
  if (!r) return;
  const sold = state.sales.filter((s) => s.recipeId === r.id).length;
  const ok = await confirmBox({ title: `¿Eliminar “${r.name || 'Torta sin nombre'}”?`, text: `Se borra la receta y su cálculo.${sold ? ` Las ${plural(sold, 'venta anotada', 'ventas anotadas')} se conservan.` : ''}`, ok: 'Eliminar', danger: true });
  if (!ok) return;
  state.recipes = state.recipes.filter((x) => x.id !== r.id); save();
  if (route.view === 'recipe') go('recipes'); else render();
  toast('Torta eliminada');
}
function cardMenu(id) {
  const r = findRecipe(id);
  if (!r) return;
  const c = calc(r);
  const inEditor = route.view === 'recipe';
  const m = openSheet({
    label: `Opciones de ${r.name || 'Torta sin nombre'}`, cls: 'sheet-sm',
    html: `${sheetHead({ art: `<span class="sh-cake">${cakeHTML(thumbProps(r), '')}</span>`, title: r.name || 'Torta sin nombre', sub: `${money(c.price)} · ${plural(c.portions, 'porción', 'porciones')}` })}
      <div class="menu-list">
        ${inEditor ? '' : `<button type="button" class="menu-item" data-m="open" data-autofocus>${I.edit}<span>Editar torta</span></button>`}
        <button type="button" class="menu-item" data-m="sale" ${inEditor ? 'data-autofocus' : ''}>${ico(ICON_D.ventas, { s: 20 })}<span>Anotar venta</span></button>
        <button type="button" class="menu-item" data-m="dup">${ico(ICON_D.copy, { s: 20 })}<span>Duplicar</span></button>
        <button type="button" class="menu-item danger" data-m="del">${I.trash}<span>Eliminar</span></button>
      </div>`
  });
  $('.menu-list', m.el).addEventListener('click', (e) => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    m.close();
    const k = b.dataset.m;
    if (k === 'open') go('recipe', { id, step: 'ing' });
    else if (k === 'sale') saleSheet(id);
    else if (k === 'dup') duplicateRecipe(id);
    else deleteRecipe(id);
  });
}

/* ======================= Acciones ======================= */
const actions = {
  'new-recipe': newRecipe,
  'new-ing': () => ingredientSheet(null),
  'edit-ing': (t) => ingredientSheet(findIng(t.dataset.id)),
  'new-sale': () => saleSheet(''),
  'sale-from-recipe': () => saleSheet(route.id),
  dview: (t) => {
    ui.dview = t.dataset.v;
    $$('[data-act="dview"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === ui.dview)));
    $('#ing-body').innerHTML = ingBody();
  },
  sview: (t) => { ui.sview = t.dataset.v; repaintPanel(); $(`[data-act="sview"][data-v="${ui.sview}"]`)?.focus(); },
  cat: (t) => { ui.cat = t.dataset.cat; repaintPanel(); $(`[data-act="cat"][data-cat="${ui.cat}"]`)?.focus(); },
  step: (t) => setStep(t.dataset.step),
  'next-step': nextStep,
  'open-ing': (t) => { const ing = findIng(t.dataset.id); if (ing) qtySheet(cur(), { ing }); },
  'more-ing': () => pickerSheet(cur()),
  'edit-line': (t) => { const r = cur(); const l = r.items.find((x) => x.id === t.dataset.id); if (l && findIng(l.ingId)) qtySheet(r, { ing: findIng(l.ingId) }); },
  'rm-line': (t) => {
    const r = cur();
    r.items = r.items.filter((l) => l.id !== t.dataset.id);
    touch(r); repaintPanel(); refreshCake(r);
    toast('Ingrediente quitado');
  },
  'toggle-extra': (t) => {
    const r = cur();
    const k = t.dataset.k;
    const name = (XPRESETS.find((p) => p[0] === k) || [])[1];
    const x = r.extras.find((e) => extraKind(e.name) === k);
    if (x) r.extras = r.extras.filter((e) => e.id !== x.id);
    else r.extras.push({ id: uid(), name, cost: '' });
    touch(r); repaintPanel();
    refreshCake(r, x ? '' : `+ ${name}`);
    if (!x) { const added = r.extras[r.extras.length - 1]; const inp = $(`#ex-cost-${added.id}`); if (inp) inp.focus({ preventScroll: true }); }
    else $(`[data-act="toggle-extra"][data-k="${k}"]`)?.focus();
  },
  'add-extra': () => {
    const r = cur();
    const x = { id: uid(), name: '', cost: '' };
    r.extras.push(x); touch(r); repaintPanel();
    $(`#ex-name-${x.id}`)?.focus();
  },
  'rm-extra': (t) => {
    const r = cur();
    r.extras = r.extras.filter((x) => x.id !== t.dataset.id);
    touch(r); repaintPanel(); refreshCake(r);
  },
  stepper: (t) => {
    const input = $('#' + t.dataset.target);
    input.value = Math.max(num(input.min), Math.round((num(input.value) + num(t.dataset.step)) * 100) / 100);
    input.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'price-mode': (t) => {
    const r = cur();
    const custom = t.dataset.mode === 'custom';
    r.price = custom ? (calc(r).price || null) : null;
    touch(r);
    $$('[data-act="price-mode"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === t.dataset.mode)));
    $('#pp-sug').hidden = custom;
    $('#pp-mio').hidden = !custom;
    const pi = $('#r-price');
    pi.value = r.price || '';
    updateOut();
    if (custom) { pi.focus(); pi.select(); }
  },
  'use-suggested': () => {
    const r = cur();
    r.price = calc(r).suggested || null; touch(r);
    $('#r-price').value = r.price || '';
    updateOut();
    toast('Precio sugerido aplicado');
  },
  'save-recipe': () => {
    const r = cur();
    persist();
    toast(`“${r.name || 'Torta sin nombre'}” guardada`);
    go('home');
  },
  'dup-recipe': () => duplicateRecipe(route.id),
  'del-recipe': () => deleteRecipe(route.id),
  'card-menu': (t) => cardMenu(t.dataset.id),
  'edit-sale': (t) => saleSheet('', t.dataset.id),
  'del-sale': async (t) => {
    const ok = await confirmBox({ title: '¿Borrar esta venta?', text: 'Se quita del resumen del mes.', ok: 'Borrar', danger: true });
    if (!ok) return;
    state.sales = state.sales.filter((s) => s.id !== t.dataset.id); save(); render();
    toast('Venta borrada');
  },
  month: (t) => {
    const [y, m] = ui.month.split('-').map(Number);
    const d = new Date(y, m - 1 + Number(t.dataset.d), 1);
    ui.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    render();
    $(`[data-act="month"][data-d="${t.dataset.d}"]`)?.focus();
  },
  export: exportFile,
  'copy-backup': copyBackup,
  'paste-backup': pasteBackup,
  'restore-snap': (t) => { const sn = readSnaps().find((s) => s.id === t.dataset.id); if (sn) restoreData(normalize(sn.data), 'snap'); },
  'lic-out': async () => {
    const ok = await confirmBox({ title: '¿Desactivar este dispositivo?', text: 'Para volver a usar la app acá tendrás que escribir tu código otra vez. Tus datos no se borran, pero descarga un respaldo si vas a cambiar de equipo.', ok: 'Desactivar', danger: true });
    if (!ok) return;
    persist();
    try { await fetch('/api/salir', { method: 'POST', credentials: 'same-origin' }); } catch (e) { toast('Necesitas conexión para desactivar'); return; }
    location.replace('/activar');
  },
  'lic-refund': async () => {
    const ok = await confirmBox({ title: '¿Pedir la devolución?', text: 'Mercado Pago te devuelve el pago completo a tu medio de pago y la app se desactiva en todos tus dispositivos. Si quieres guardar tus recetas, descarga antes un respaldo.', ok: 'Pedir devolución', danger: true });
    if (!ok) return;
    persist();
    let d = {};
    try {
      const res = await fetch('/api/devolucion', { method: 'POST', credentials: 'same-origin' });
      d = await res.json().catch(() => ({}));
      if (!res.ok) { toast(d.message || 'No pudimos pedir la devolución. Prueba de nuevo.'); return; }
    } catch (e) { toast('Necesitas conexión para pedir la devolución'); return; }
    toast('Listo: Mercado Pago te devuelve el dinero');
    setTimeout(() => location.replace('/'), 1800);
  },
  'replay-onb': () => onboarding(),
  'load-sample': () => { const r = addSample(); go('recipe', { id: r.id, step: 'ing' }); toast('Agregamos una torta de ejemplo'); },
  reset: async () => {
    const ok = await confirmBox({ title: '¿Borrar todos los datos?', text: 'Se eliminan tus tortas, ingredientes y ventas de este navegador. Guardamos una copia automática antes, por si te arrepientes.', ok: 'Borrar todo', danger: true });
    if (!ok) return;
    makeSnapshot('reset');
    state = defaults(); fmtCache.clear(); persist();
    go('home'); onboarding();
  }
};

const inputs = {
  r: (t) => {
    const r = cur(); if (!r) return;
    const k = t.dataset.k;
    if (k === 'name') { r.name = t.value.replace(/\n/g, ' '); fitTitle(); }
    else if (k === 'notes') r.notes = t.value;
    else if (k === 'price') r.price = numOrNull(t.value);
    else r[k] = t.value === '' ? '' : num(t.value);
    touch(r); updateOut();
  },
  extra: (t) => {
    const r = cur();
    const x = r.extras.find((e) => e.id === t.dataset.id); if (!x) return;
    if (t.dataset.k === 'cost') x.cost = t.value === '' ? '' : num(t.value);
    else { const before = extraKind(x.name); x.name = t.value; if (extraKind(x.name) !== before) refreshCake(r); }
    touch(r); updateOut();
  },
  margin: (t) => {
    const r = cur();
    r.margin = clamp(num(t.value), 0, 90);
    touch(r); updateOut();
  },
  setting: (t) => {
    const k = t.dataset.k;
    state.settings[k] = k === 'business' ? t.value : num(t.value);
    if (k === 'business') { const s = $('#brand-sub'); if (s) s.textContent = t.value || 'Costos y ganancias'; }
    save();
    if (route.view === 'recipe') updateOut();
  },
  search: (t) => { ui.q = t.value; $('#recipe-list').innerHTML = recipeList(); },
  isearch: (t) => { ui.iq = t.value; $('#ing-body').innerHTML = ingBody(); }
};

const changes = {
  'ing-price': (t) => {
    const ing = findIng(t.dataset.id); if (!ing) return;
    ing.price = num(t.value); ing.updatedAt = Date.now(); ing.sample = false;
    save();
    const row = t.closest('tr');
    row.classList.remove('is-sample');
    const tag = $('.in-txt .tag', row); if (tag) tag.remove();
    $('[data-unitcost]', row).innerHTML = num(ing.price) > 0 ? `<b>${money(unitCost(ing) * PER[ing.type].f)}</b><small>por ${PER[ing.type].label}</small>` : '<small>falta el precio</small>';
    const used = usedIn(ing.id).length;
    const agoCell = $('[data-ago]', row);
    agoCell.classList.remove('warn');
    agoCell.innerHTML = `hoy${used ? `<small>en ${plural(used, 'torta', 'tortas')}</small>` : ''}`;
    toast(used ? `Precio actualizado. ${plural(used, 'torta recalculada', 'tortas recalculadas')}` : 'Precio actualizado');
  },
  currency: (t) => { state.settings.currency = t.value; fmtCache.clear(); save(); render(); toast('Moneda cambiada'); },
  'import-file': (t) => { const f = t.files && t.files[0]; t.value = ''; readBackupFile(f); }
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-open],[data-act]');
  if (!t || t.closest('.overlay') || t.closest('.onb')) return;
  e.preventDefault();
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.open) { go('recipe', { id: t.dataset.open, step: 'ing' }); return; }
  const fn = actions[t.dataset.act];
  if (fn) fn(t, e);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'r-name') { e.preventDefault(); e.target.blur(); } });
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.in && inputs[t.dataset.in] && !t.closest('.overlay') && !t.closest('.onb')) inputs[t.dataset.in](t, e);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.ch && changes[t.dataset.ch] && !t.closest('.overlay') && !t.closest('.onb')) changes[t.dataset.ch](t, e);
});
window.addEventListener('resize', () => { if (route.view === 'recipe') fitTitle(); });
